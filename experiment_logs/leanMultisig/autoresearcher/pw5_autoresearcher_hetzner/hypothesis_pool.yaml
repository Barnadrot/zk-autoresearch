# pw5 autoresearcher — hypothesis pool
#
# Schema:
#   current_pool: list of EXACTLY 3 entries at any given time
#   history:      append-only, consumed entries with iter outcomes
#
# Gate enforcement:
#   eval_paired.sh refuses to run if current_pool count != 3
#   (exit 2 = infra error, NOT discard)
#
# Required fields per entry:
#   id:               stable short identifier (h1, h2, ...)
#   paper_anchor:     eprint ref with section/page OR cross-component analysis sketch
#                     (one of the two — REQUIRED)
#   mechanism:        one-paragraph explicit mechanism statement
#   predicted_pct:    single Δ% number (negative = wall-clock improvement)
#   plumbing:         list of <file>:<line-range> showing where the change goes
#   kill_condition:   what would tell you this hypothesis is wrong BEFORE measurement
#
# Refill lifecycle (per iter):
#   1. Agent selects one entry from current_pool to implement
#      (justify the pick in the implementation commit body)
#   2. Run gate (eval_paired.sh)
#   3. On gate completion: move entry to history with iter_id + result
#   4. Refill current_pool back to 3 BEFORE next iter starts
#
# Cross-reference:
#   iters.tsv hypothesis_id column matches the id field here
#   iters.tsv = what was implemented
#   this file  = what was considered (and history of consumed entries)
#   Both are required for full audit.
#
# At iter 1 start: current_pool is empty. Agent populates 3 entries by reading
# program.md + papers + source. Gate refuses iter 1 launch until pool is filled.
#
# Example entry shape (commented out — gate ignores; for reference only):
#
# - id: hX
#   paper_anchor: "Bagad 2025/719, §3.2"
#   mechanism: |
#     Pack two independent Poseidon1 permutations into one SIMD instruction
#     stream to hide MDS latency. Per the packed-sumcheck principle, instance
#     interleaving uses the same registers across two permutation contexts;
#     when MDS of perm 1 stalls on dependency chain, perm 2's S-box issues fill
#     the pipeline.
#   predicted_pct: -5.0
#   plumbing:
#     - "leanMultisig/crates/backend/koala-bear/src/poseidon1_koalabear_16.rs:945-1032"
#     - "leanMultisig/crates/backend/symetric/src/compression.rs (new compress_layer_x2)"
#   kill_condition: |
#     Register pressure blows the 32 ZMM budget on Zen 4 — measurable as
#     additional stack spill on the compress_mut hot line (currently 2.22% at
#     0x780 offset). If post-change perf annotate shows new spill > +0.5%
#     of compress_mut self-time, the mechanism is unrecoverable on this hardware.

current_pool: []

history: []
