      Extracting only the homogeneous part requires modifying every Air implementation
      (Poseidon, Execution, Extension) to expose a separate degree-d-only evaluation — an
      invasive architectural change that would not be a net simplification. For degree-2
      product sumcheck, sumcheck_quadratic already computes the leading coefficient directly.
      DO NOT REATTEMPT eval-at-infinity for high-degree AIR sumcheck without a homogeneous
      constraint extraction mechanism.
    mechanism: >
