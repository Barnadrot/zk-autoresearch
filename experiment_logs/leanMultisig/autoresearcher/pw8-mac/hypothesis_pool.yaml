  - id: h50
    status: killed_at_analysis
    predicted_pct: -2.0
    breadth: cross-crate (lean_prover + sub_protocols + whir)
    paper_anchor: >
      Dao and Thaler "Speeding Up Sum-Check Proving" (eprint 2025/1117, §5 — fused
      computation passes for avoiding redundant memory traversals); Bootle et al. "Sumcheck
      Arguments and their Applications" (eprint 2021/333, §3 — efficient multilinear
      evaluation with combined folding).
    mechanism: >
      Fused fold + round-compute for AIR sumcheck. Currently process_challenge (line 268
      in air_sumcheck.rs) folds ALL multilinears via fold_at_bit, which traverses all 109
      columns × 2^(nv-round) elements. Then compute_raw_poly_degree_split reads the folded
      columns again for the next round. This is TWO full passes over column data per round.
      By fusing the fold into the round-compute kernel (similar to fold_and_compute_round_packed
      in quotient_gkr/sumcheck_utils.rs), we eliminate one full pass. At round r with fold_bit=2:
      each column has 2^(12-r) packed elements. For the Poseidon table (109 cols × 2^10 = 22MB
      at round 0), saving one pass saves ~22MB DRAM read. Over 10 rounds (geometric decrease):
      ~44MB total. At ~60GB/s DDR5: ~0.7ms. BUT the bigger win is L2 cache: the fused pass
      accesses each element ONCE (fold + evaluate), keeping it in L2 for the constraint eval.
      Two-pass accesses it TWICE (fold then re-read), potentially evicting from L2 between
      passes. Estimated L2 cache benefit: ~40ms from reduced L2 misses in the Poseidon AIR.
    plumbing:
      - crates/sub_protocols/src/air_sumcheck.rs:268-290 (process_challenge — fuse fold into compute)
      - crates/sub_protocols/src/air_sumcheck.rs:403-557 (compute_raw_poly_degree_split — accept pre-fold data)
      - crates/lean_prover/src/prove_execution.rs (no change)
    kill_condition: >
      If the fused fold+compute kernel is significantly more complex than the separate
      fold+compute and the compiler can't optimize it well, the overhead may exceed savings.
      If fold_at_bit already uses cache-efficient streaming (sequential access), the L2
      benefit is zero. Check whether fold_at_bit's access pattern is sequential or strided.

