      padding pairs (skip entirely), we avoid ~15% of the work.
      At nv=25 product sumcheck ~140ms: 15% savings = ~21ms = -1.3%.
      Combined with nv=25: 1.624 - 0.021 = 1.603s.
    plumbing:
