    mechanism_summary: "Fuse Poseidon1 partial-round pairs to eliminate 10 witness columns — degree 3^2=9 fits within degree_air=10"
    post_mortem: |
      Killed during analysis (iter 10 context). Fusing 2 partial rounds WITHOUT full state
      checkpointing causes degree explosion: state[i>0] carries degree-3 terms between fused
      pairs → cube(degree-3) = degree-9 within one pair is fine, BUT the NEXT pair's input
      includes state elements that passed through the previous sparse MDS multiply carrying
      degree-3 s0, so cube(degree-3) = degree-9 in the s0 lane, then sparse matrix propagates
      degree-9 to all state elements, making the next cube degree-27. Fundamental algebraic
      constraint prevents fusion without per-round checkpointing (which adds columns — killed
      by h17 lesson). Same root cause as h19.
      NOTE (h35 update): h2 was killed because it described fusing WITHOUT CHECKPOINTS BETWEEN
      PAIRS. h35 retains checkpoints at every-2-round boundaries (10 checkpoints for 20 rounds)
      and verifies each PAIR independently at degree 9. The degree-27 issue only arises when
      fusing 3+ rounds without intermediate checkpoints.

