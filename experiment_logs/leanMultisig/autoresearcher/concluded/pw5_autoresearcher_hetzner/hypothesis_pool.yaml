current_pool:
  - id: h50
    paper_anchor:
      - "Arnon, Chiesa, Fenzi, Yogev 2024/1586, S6.1 -- pipeline-parallel proving phases for WHIR-like PCS"
      - "Thaler 2013/351, S3.2 -- sumcheck prover cost dominated by data preparation when table is large"
      - "Setty 2020/1618, S4.1 -- decoupling data layout from Fiat-Shamir sequential dependency"
    mechanism: |
      Move AIR sumcheck data preparation (shifted columns + column bit-reversal) BEFORE the
      logup/GKR phase. These operations depend only on raw trace data — NOT on Fiat-Shamir
      challenges from the commitment or logup. Currently they run sequentially AFTER the 475ms
      logup phase, adding 20ms to the critical path.

      The bit-reversal (18ms across 3 tables: execution 8.6ms, poseidon16 9.2ms, extension_op
      0.3ms) permutes column data within 2^12 chunks for the endianness-pivot fold schedule.
      This is purely a data transformation on the packed base-field columns.

      Implementation: extract bit-reversal from AirSumcheckSession::new into a standalone
      precomputation. Compute shifted columns and bit-reverse all table columns immediately
      after trace generation (before stack+commit). Pass pre-bit-reversed MleGroup to session
      constructors after logup completes.

      Savings: 20ms removed from critical path. At 1.61s warm prove: -1.24%.
      Mechanistic: eliminated serial dependency between independent data transformations.
    predicted_pct: -1.2
    plumbing:
      - "leanMultisig/crates/sub_protocols/src/air_sumcheck.rs (add already_bit_reversed flag to AirSumcheckSession::new, skip BR when set)"
      - "leanMultisig/crates/lean_prover/src/prove_execution.rs (move shifted_rows + pack + BR before prove_generic_logup, pass precomputed to sessions)"
    kill_condition: |
      If the bit-reversal's memory traffic interferes with the commit FFT/Merkle that precedes
      logup (cache pollution), the moved preparation could slow the commit phase. Kill if
      commit+logup combined time increases despite the serial overlap savings. Also kill if
      warm-proof recycling means the bit-reversal vectors don't benefit from pre-allocation
      (zk-alloc reuses exact sizes from the previous proof iteration anyway).

  - id: h51
    paper_anchor:
      - "Ulvetanna/Binius 2023/1784, S4.2 -- batched memory checking via vector-valued logup"
      - "Haboeck 2022/1530, S3 -- logup protocol with multi-value random linear combination"
      - "Setty, Thaler 2023/552, S4.3 -- reducing GKR prover cost via lookup batching"
    mechanism: |
      Reduce logup entry count by batching contiguous memory accesses into single vector-valued
      lookups. Currently each lookup of k values at address_offset+0..k-1 generates k separate
      logup entries (one per memory cell). This inflates logup data from ~4.4M to 17.6M entries,
      requiring GKR at n_vars=25 (20 layers).

      With vector-valued logup: each k-value lookup generates 1 entry with challenge:
        c - sum(alpha^j * value[j] for j in 0..k)
      The memory table presents matching vector entries. Entry count drops from 17.6M to ~4.4M
      (average k≈4), reducing GKR n_vars from 25 to ~22 (17 layers instead of 20).

      GKR cost scales linearly with data size. From 393ms * (2^22/2^25) = ~49ms. Total savings:
      ~344ms = -21% of warm prove time.

      RISK: the memory table must be restructured to present vector entries, requiring changes
      to the memory consistency argument. The bus protocol must support vector-valued entries.
      Very large implementation surface.
    predicted_pct: -21.0
    plumbing:
      - "leanMultisig/crates/lean_vm/src/tables/memory.rs (restructure to vector-valued entries)"
      - "leanMultisig/crates/lean_vm/src/lookups.rs (batch contiguous lookups into single vector entry)"
      - "leanMultisig/crates/sub_protocols/src/logup.rs (vector-valued logup data preparation)"
      - "leanMultisig/crates/lean_vm/src/bus.rs (multi-value bus channel)"
    kill_condition: |
      If the vector-valued logup requires extending the bus width beyond current alpha_powers
      capacity. If the memory table restructuring breaks the stacking layout (changes n_vars
      threshold). If the vector entries create uneven GKR layer sizes that prevent the packed
      bit-reversed optimization.

  - id: h52
    paper_anchor:
      - "Thaler 2013/351, S3.2 -- sumcheck cost proportional to 2^{n-r} evaluations per variable"
      - "Setty 2020/1618, S4.1 -- fused fold-and-evaluate reduces memory passes in sumcheck prover"
      - "Arnon, Chiesa, Fenzi, Yogev 2024/1586, S5.3 -- deferred binding in multi-round sumcheck"
    mechanism: |
      Fuse the fold pass into the polynomial computation in GKR's run_phase2_sumcheck.
      Phase 2 currently does SEPARATE fold + compute per round: after computing the round
      polynomial (reading all 4 arrays num_l, num_r, den_l, den_r), it calls
      fold_normal_with_padding 4 times (reading the same arrays again).

      Fused approach: during compute, write folded values into output buffers simultaneously.
      Since fold = lo + r*(hi-lo) and the compute already reads (lo, hi) pairs, we can produce
      the folded output with ~0 extra cost (1 mul + 1 add per element, already available).

      For the largest GKR layer (2^24 elements), phase 2 starts at 2^17 and runs 16 rounds.
      Total fold traffic eliminated: 4 arrays × sum(2^{17-r} for r=0..15) × 20B ≈ 80MB.
      At 50GB/s: ~1.6ms savings — too small alone. But combined with eliminating the separate
      allocation for folded output: reduced allocation pressure + cache improvement.

      More impactful for SMALLER GKR layers (layers 1-15) where cache is warm and fold traffic
      competes with compute data. Combined across all 20 layers: ~5-8ms.
    predicted_pct: -0.4
    plumbing:
      - "leanMultisig/crates/sub_protocols/src/quotient_gkr/sumcheck_utils.rs (fuse fold into compute in run_phase2_sumcheck loop)"
    kill_condition: |
      If the fused loop body prevents LLVM auto-vectorization of the pair_coeffs computation.
      If the write-back to folded output causes store-buffer pressure that stalls the sumcheck
      accumulation. If total savings < 5ms (below noise floor).

