current_pool:
  - id: s2
    paper_anchor: "Ben-Sasson et al., ePrint 2018/740 §5.2 (Merkle PCS); Thaler, Springer 2013 §3.2 (sumcheck evaluation cost ∝ degree)"
    mechanism: |
      Split WHIR commitment for hash-dominant tables: prove Blake3-constrained rows and Poseidon16
      rows with table-specific effective heights so stacked_pcs does not pad hash tables to
      global stacked_n_vars driven by memory/bytecode — reduces DFT encode + Merkle leaf work
      proportional to (2^n_vars reduction) on hash slices. pw5 h31 showed ~4% from 5% column
      width drop; n_vars is exponential in column budget.
    predicted_pct: -8.0
    plumbing:
      - crates/sub_protocols/src/stacked_pcs.rs
      - crates/sub_protocols/src/prove/verify_execution.rs
      - crates/whir/src/open.rs
    kill_condition: "stacked_n_vars unchanged in prove log; OR InvalidProof; OR pw5 h44-style regression (extra WHIR rounds from column split)."

  - id: s3
    paper_anchor: "Arnon et al., ePrint 2024/1586 §6.1 (constraint-degree tradeoffs); Gabizon et al., ePrint 2020/315 §3 (witness width vs eval cost)"
    mechanism: |
      Pack Poseidon16+Blake3 control flags (permute, half_output, hardcoded_left) into existing
      precompile_data encodings and remove dedicated committed flag columns from trace layout
      where production xmss never sets permute=1 — narrows total trace width → lower
      stacked_n_vars / Merkle / fold cost (pw5 h31 −4% from 8 cols; similar magnitude if
      4–6 flag/index cols removed without new constraints).
    predicted_pct: -6.0
    plumbing:
      - crates/lean_vm/src/tables/poseidon_16/mod.rs:90-120,378-396
      - crates/lean_vm/src/tables/blake3/mod.rs:18-30,178-200
      - crates/sub_protocols/src/stacked_pcs.rs:197-220
    kill_condition: "Constraint folder mismatch in correctness; OR n_columns unchanged; OR degree_air increases."

  - id: s6
    paper_anchor: "Grassi et al., ePrint 2019/458 §3 (Poseidon1 width-16); Arnon et al., ePrint 2024/1586 §6.1"
    mechanism: |
      Remove Poseidon16 flag_permute + outputs_right columns when bytecode never calls poseidon16_permute
      (xmss_aggregate.py grep shows zero permute). pw5 h31 removed 8 dead outputs_right cols for −4%;
      permute flag still committed — if logup allows encoding permute in precompile_data only,
      drop 1 flag + 8 output cols (~9 cols × 2^17 ≈ 1.2M cells); may need paired logup change.
    predicted_pct: -4.0
    plumbing:
      - crates/lean_vm/src/tables/poseidon_16/mod.rs
      - crates/sub_protocols/src/logup.rs
    kill_condition: "conditional_inactive breaks; OR n_columns unchanged; OR correctness fails."

