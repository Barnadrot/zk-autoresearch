  - id: h49
    paper_anchor: >
      Thaler, §4.3.1; Chiesa et al., Marlin §4.1
    mechanism: Lazy weight evaluation in product sumcheck (eliminate 1.28GB combined_weights materialization).
    predicted_pct: -3.0
    iter_id: null
    result: killed
    diagnostic: >
      Killed in Phase 1. The eq-polynomial materialization (compute_eval_eq_packed_dual) is ~56%
      compute-bound, ~44% bandwidth-bound. Lazy on-the-fly evaluation during the product sumcheck
      would save ~60ms bandwidth but add ~48ms compute (8 rounds × 6ms per round for on-the-fly
