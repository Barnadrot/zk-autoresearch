  - id: h48
    paper_anchor: >
      Thaler, §4.3.1; Vu et al., IEEE S&P 2013 §5.1
    mechanism: Batch parallel post-GKR column evaluations (evaluate_sequential + outer par_iter).
    predicted_pct: -1.5
    iter_id: 30
    result: killed
    diagnostic: >
      +0.02% (p=0.91, n=12). Pre-collected unique column indices per table, batch-evaluated all
      via par_iter + evaluate_sequential, parallelized top-3 large evaluations via rayon::join.
      Zero measurable improvement. Post-GKR evaluation total time is <10ms, making the optimization
      below noise floor. The original sequential evaluate() with internal PARALLEL=true was already
      efficient. Closes post-GKR parallelization approach.

