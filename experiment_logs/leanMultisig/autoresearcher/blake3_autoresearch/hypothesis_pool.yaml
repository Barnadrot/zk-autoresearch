current_pool:
  - id: h60
    paper_anchor: >
      Cooley & Tukey, "An Algorithm for the Machine Calculation of Complex Fourier Series,"
      Mathematics of Computation 1965 §2 (butterfly decomposition);
      Plonky3, "radix_2_small_batch.rs" (reference DFT implementation).
    mechanism: >
      Eliminate redundant twiddle multiplications in the DFT initial layers by exploiting the
      twiddle-free butterfly at position 0 of each block. Currently, the initial_layers phase
      (6 layers, L1-cache-local) uses dft_layer which special-cases i==0 to use TwiddleFreeEvalsButterfly
      (0 multiplies instead of 1). But the parallel triple-layer groups (4 groups × 3 layers = 12 layers)
      do NOT use this optimization — fft_triple_layer_single_twiddle applies the same butterfly to
      all 4 pairs in a block, including index 0.

      For each triple-layer group, 1 out of every 8 butterflies at the finest layer is at index 0
      and could use TwiddleFree. Similarly, 1 out of 4 at the middle layer, and 1 out of 2 at the
      coarsest layer. Total per 8 elements: 3 skippable twiddle muls out of 12 = 25% reduction.

      HOWEVER: looking at the EvalsButterfly for evaluations-DFT specifically, the butterfly is
      (x1 + x2_tw, x1 - x2_tw) where x2_tw = fused_sub_mul(x1, tw) = (x2-x1)*tw. At tw=1 (twiddle-free),
      this becomes (x2, 2*x1 - x2). The current TwiddleFreeEvalsButterfly already implements this
      (line 553: (x2, x1.double() - x2)). The question is whether the triple-layer code path
      actually encounters tw=1 butterflies that aren't being optimized.

      KILL CHECK: Need to verify that the triple-layer twiddle tables actually contain 1.0 entries
      at the expected positions. If the twiddle table is reindexed to exclude them, no savings exist.
    predicted_pct: -1.5
    plumbing:
      - crates/whir/src/dft.rs (add twiddle-free checks in triple-layer butterfly groups)
    kill_condition: >
      Kill if twiddle tables don't contain 1.0 entries (already optimized out during table construction).
      Kill if branch prediction cost of checking tw==1 exceeds the multiplication savings.
      Kill if measured delta is within noise floor.

  - id: h58
    paper_anchor: >
      Bünz et al., "Proofs for Inner Pairing Products and Applications," ePrint 2019/1177 §5;
      Thaler, "Proofs, Arguments, and Zero-Knowledge," §4.3.1 (eq polynomial recursion);
      Intel, "Zen 4 Microarchitecture," AMD PPR §2.7.2 (memory bandwidth).
    mechanism: >
      Fuse the first product sumcheck round into combine_statement by interleaving the eq-polynomial
      recursive doubling with the product sumcheck's half-element accumulation.

      Currently combine_statement (135ms) materializes the full 2^22 EFPacking combined_weights buffer
      via 22 passes of recursive doubling. Then run_product_sumcheck Round 0 (specialized BasePacked ×
      ExtensionPacked path) reads this 1.34GB buffer twice — once for lo elements and once for hi —
      performing 2 multiplies per pair across 2^21 pairs.

      The fused approach: instead of materializing combined_weights, interleave the eq-polynomial
      doubling with the sumcheck accumulation. After the eq-polynomial doubling reaches the per-thread
      chunk level (after LOG_NUM_THREADS=3 precomputation passes), each thread continues the remaining
      19 passes of recursive doubling BUT also maintains 2 running sumcheck accumulators. When a thread
      finishes its eq chunk, it has both (a) the combined_weights chunk AND (b) the first-round
      sumcheck coefficients for that chunk. The weights are CONSUMED during the sumcheck computation
      and never fully materialized.

      This differs from H49/H50 (killed) in a crucial way: H49 tried LAZY eq computation during ALL 8
      sumcheck rounds (adding per-round overhead). H50 tried fusing ALL of combine_statement into
      round 0 via SplitEq (adding per-pair multiplies). This approach fuses ONLY the materialization
      pass with the FIRST read of the weights — the eq polynomial is still computed via recursive
      doubling (no extra multiplies), but the first sumcheck round piggybacks on the same memory
      traffic. The weights are consumed in-flight, eliminating the 1.34GB write + 1.34GB first-read.

      Savings: ~2.68GB bandwidth eliminated (1.34GB write from combine_statement + 1.34GB read from
      sumcheck round 0). At ~40GB/s memory bandwidth on this machine, that's ~67ms of bandwidth.
      However, the passes are compute-bound (56% per analysis), so realistic savings are ~30-40ms
      (2-2.5% of total).
    predicted_pct: -2.0
    plumbing:
      - crates/whir/src/open.rs (fuse combine_statement into run_initial_sumcheck_rounds)
      - crates/backend/sumcheck/src/product_computation.rs (new fused first-round kernel)
      - crates/backend/poly/src/eq_mle.rs (streaming eq computation variant)
    kill_condition: >
      Kill if the fused kernel cannot maintain the same numerical result as separate
      combine_statement + run_product_sumcheck (correctness gate). Kill if the interleaved
      computation defeats out-of-order execution by serializing the eq doubling with the
      sumcheck multiply (Zen 4 may not have enough ILP to overlap them). Kill if measured
      delta is within noise floor (the bandwidth savings are masked by compute-boundedness).

history:
  - id: h59
    paper_anchor: >
      Gupta et al., ePrint 2022/1386 §4.2; Thaler §13.3; Bowe et al., ePrint 2019/1021 §5.3
    mechanism: Mid-degree extraction in Poseidon16 AIR sumcheck (interpolate degree-3 intermediate state at skip points).
    predicted_pct: -3.5
    iter_id: 34
    result: killed
    diagnostic: >
      +2.2% regression (1.692s vs 1.656s). Overhead of Lagrange coefficient computation, state
      capture (4 boundaries × 16 width × 4 full points), and copy_from_slice restore at 6 skip
      points exceeded savings from skipping second cube+MDS. The capture/restore bookkeeping adds
      branch prediction misses and cache pressure in the hot inner loop. Closes mid-degree
      extraction approach for AIR sumcheck.

