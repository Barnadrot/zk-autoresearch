      requires maintaining scalar eq tables (2 × 2^26 × 20B = 2.68GB) that are LARGER than the
      current packed combined_weights (1.34GB). Closes lazy-weight-evaluation approach.

  - id: h46
    paper_anchor: >
      Frigo et al., "Cache-Oblivious Algorithms," FOCS 1999, §4
    mechanism: Cache-blocked tiled transpose for prepare_evals_for_fft_unpacked.
    predicted_pct: -2.0
    iter_id: 25
    result: killed
    diagnostic: >
      -0.30% (p=0.08, n=24). L2-aware tiling (32 cols × 4K rows per tile) did not improve over
      rayon's default par_iter chunking. rayon distributes contiguous output ranges to threads,
      providing adequate spatial locality. The stride-2^18 random reads are absorbed by L3 and
      hardware prefetch in the parallel setting. Combined with H44's result (fused transpose also
      failed), this conclusively closes the DFT prep transpose optimization line.

  - id: h47
    paper_anchor: >
      Multiple (see analysis)
    mechanism: Multiple attempted hypotheses — Merkle tiling, NT stores, column interleaving — all self-killed during analysis.
    predicted_pct: -1.5
    iter_id: null
    result: killed
    diagnostic: >
      Killed in Phase 1. Three successive replacement hypotheses were generated and analyzed:
      (1) L3-tiled Merkle leaf hashing: killed because par_iter already distributes contiguous
      row blocks to threads, and the row-major DFT output has perfect sequential locality.
      (2) Non-temporal stores for stacking: killed because glibc memcpy already auto-selects
      NT stores for >256KB copies on Zen 4.
      (3) Interleaved column buffers for AIR sumcheck: killed because copy cost (3ms) exceeds
      pointer indirection savings (2ms), and OoO execution hides the indirection anyway.

  - id: h45
    paper_anchor: >
      Blelloch & Gibbons, "Effectively Adequate Parallelism," IEEE Computer 2004, §2;
      Thaler, "Proofs, Arguments, and Zero-Knowledge," §13.1 (prover compute optimization).
    mechanism: Interpolate high-degree constraint results from n_full=4 evaluation points to skip 5 AIR evals with skip_low.
    predicted_pct: -1.8
    iter_id: null
    result: killed
    diagnostic: >
      Killed in Phase 1. The math is fundamentally wrong: each high-degree constraint is degree 9
      in z (because point[k] is linear in z and the constraint polynomial is degree 9 in the point
      values). The accumulated acc_high(z) is therefore a degree-9 polynomial in z. Interpolating a
      degree-9 polynomial requires 10 evaluation points, but Phase 1 only provides n_full=4 points.
      You'd need ALL 10 points to interpolate, which is exactly what the code already computes.

