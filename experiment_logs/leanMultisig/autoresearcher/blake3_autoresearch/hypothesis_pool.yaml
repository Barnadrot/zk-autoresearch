  - id: h50
    paper_anchor: >
      Thaler, §4.3.1; §13.1
    mechanism: Fuse combine_statement into first product sumcheck round (streaming eq weights).
    predicted_pct: -3.0
    iter_id: null
    result: killed
    diagnostic: >
      Killed in Phase 1. On-the-fly per-element eq evaluation requires O(n_vars × 2^n_vars) work
      vs recursive doubling's O(2^(n_vars+1)). For n_vars=22: per-element is 10x more compute.
      SplitEq decomposition (hi/lo split) saves 135ms from combine_statement but adds ~205ms of
      extra EFPacking multiplies in the product sumcheck inner loop (4 muls/pair vs 2 muls/pair).
      Net regression. No streaming approach can beat the materialized recursive-doubling eq
      computation for this buffer size. Closes fused-combine-statement approach.

