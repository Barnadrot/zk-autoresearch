current_pool:
  - id: h34
    paper_anchor: |
      1. WHIR paper (Glinstein, Haböck, Papini eprint 2024/1586, §4.2):
         Folding factor controls the FRI/WHIR round structure. Larger initial folding
         reduces total WHIR rounds at the cost of wider FFT matrices.
      2. leanMultisig WHIR config (crates/lean_prover/src/lib.rs:26-27):
         WHIR_INITIAL_FOLDING_FACTOR=7, WHIR_SUBSEQUENT_FOLDING_FACTOR=5.
         With n=26: 3 WHIR rounds + final at 4 vars.
      3. CLAUDE.md (updated): "Changing WHIR parameters triggers bytecode recompilation
         in the recursion circuit. This is expected — budget for recompilation time."
    mechanism: |
      Increase WHIR_INITIAL_FOLDING_FACTOR from 7 to 8.

      Current: initial=7, subsequent=5 → n_rounds=3, final_sumcheck_rounds=4
      Proposed: initial=8, subsequent=5 → n_rounds=2, final_sumcheck_rounds=8

      This ELIMINATES one WHIR round entirely:
        Round 2 currently costs: ~18ms Merkle + ~9ms FFT + ~2ms sumcheck + ~7ms misc = ~36ms
        Plus: reduced opening work in round 1 (smaller eq polynomial, fewer queries)

      The DFT matrix changes from 2^20 × 128 to 2^19 × 256 (same total 2^27 elements).
      Merkle: 2^19 rows × 32 absorptions vs 2^20 rows × 16 absorptions = same 16M perms.

      The initial product sumcheck runs 8 rounds instead of 7 (marginal ~15ms increase).
      Net: -36ms (round elimination) - 20ms (reduced round 1) + 15ms (extra sumcheck round) ≈ -41ms = -2%.

      BUT: the real savings may be larger because:
        - Reduced proof size → less serialization overhead
        - Fewer Merkle path openings → fewer hash computations in opening
        - The recursion circuit with fewer rounds may be smaller

      Requires: recursion circuit recompilation (budget ~30 min).
    predicted_pct: -3
    plumbing:
      - crates/lean_prover/src/lib.rs:26 (WHIR_INITIAL_FOLDING_FACTOR = 8)
      - crates/rec_aggregation/zkdsl_implem/main.py (update hardcoded round counts)
      - crates/rec_aggregation/src/compilation.rs (recompile bytecode)
    kill_condition: |
      Kill if: (1) Recursion circuit fails to close after recompilation.
      (2) Measured savings < 1%. (3) Proof size increases > 20%.

  - id: h35
    paper_anchor: |
      1. Zeilberger "Khatam" (eprint 2024/1843, §3-4): Tighter proximity gaps for
         Reed-Solomon codes yield same soundness with smaller expansion factor.
      2. WHIR paper (eprint 2024/1586, §5): Security analysis for WHIR with
         Johnson bound. The expansion factor (log_inv_rate) directly controls
         DFT size, Merkle size, and query count.
      3. Haböck & Papini "Improved Proximity Gaps" (eprint 2025/2046):
         State-of-the-art proximity gap analysis.
    mechanism: |
      Increase RS_DOMAIN_INITIAL_REDUCTION_FACTOR from 5 to 6.

      This reduces the RS domain after round 0 by an additional factor of 2.
      After round 0: log_inv_rate goes from 1+7-5=3 to 1+7-6=2.
      This halves the domain for all subsequent WHIR rounds.

      Round 1 DFT: 2^{19+3}=2^22 → 2^{19+2}=2^21 elements (50% reduction)
      Round 1 Merkle: 2^{22}/32 rows → 2^{21}/32 rows (50% reduction)
      Round 2 similarly halved.

      Round 1 currently: ~92ms (FFT ~20ms, Merkle ~72ms).
      50% reduction: ~46ms saved.
      Round 2 similarly: ~15ms saved.
      Total: ~61ms = -3%.

      BUT: requires security verification. The reduction factor affects the
      soundness guarantee. Need to verify the security budget allows this.
    predicted_pct: -3
    plumbing:
      - crates/lean_prover/src/lib.rs:28 (RS_DOMAIN_INITIAL_REDUCTION_FACTOR = 6)
      - crates/whir/src/config.rs (verify security computation accepts new params)
      - crates/rec_aggregation/ (recompile if round structure changes)
    kill_condition: |
      Kill if: (1) Security computation shows insufficient soundness.
      (2) Recursion circuit doesn't close. (3) Measured savings < 1%.

  - id: h31
    paper_anchor: |
      1. Dao & Thaler "Speeding Up Sum-Check Proving" (eprint 2025/1117, §3):
         Tiled delayed-reduction inner loops for sumcheck, processing K elements per
         iteration to amortize Montgomery reductions across the tile.
      2. Plonky3 WHIR implementation (whir/src/sumcheck/strategy.rs:52-69):
         chunk_round_step with K=8, using mixed_dot_product::<K> to accumulate K
         products before a single Montgomery reduction.
      3. Montgomery "Modular Multiplication Without Trial Division" (Math. Comput. 1985):
         Montgomery reduction is the dominant per-operation overhead in prime fields.
    mechanism: |
      Tile the GKR sumcheck inner loop (compute_round_packed) with K=8 batching.

      Current flow (quotient_gkr/sumcheck_utils.rs:429-437):
        for inner in 0..quarter:
          coeffs = pair_coeffs(...)   // 3 sumcheck_quadratic calls = 6 ext muls
          local += coeffs * eq_within[inner]   // 4 ext muls
        // Total: 10 ext muls per element, each with full Montgomery reduction chain

      Proposed flow:
        Process K=8 elements at a time:
        for chunk in 0..quarter/K:
          // Accumulate K pair_coeffs into unreduced accumulators
          // Single Montgomery reduction per K elements
          // eq_within multiplication batched similarly

      Each quintic ext mul = 5 dot_product_4 = 5×16.5 = 82.5 cycles on Zen4.
      10 ext muls × 82.5 = 825 cycles/element. With K=8 tiling, reduce Montgomery
      reductions from 5×10=50/element to 50/8≈6.25/element. Each Montgomery reduction
      ≈ 4 cycles on Zen4. Savings: (50-6.25)×4 = 175 cycles/element = 21% of inner loop.

      GKR is 330ms. Inner loop dominates (~70% = 230ms). 21% of 230ms = ~48ms savings.
      Predicted: -48ms / 2120ms = -2.3%.

      REVISED: Actually the Montgomery reductions are already amortized WITHIN each
      dot_product_4 (4 products → 1 reduction). The per-element overhead is the
      quintic_mul dispatch, not raw reductions. Real savings from K=8 tiling would
      come from reducing loop overhead and improving instruction scheduling.
      Revised estimate: -1.5% to -3%.
    predicted_pct: -2
    plumbing:
      - crates/sub_protocols/src/quotient_gkr/sumcheck_utils.rs:403-442 (compute_round_packed — tile inner loop)
      - crates/backend/sumcheck/src/product_computation.rs:302-311 (sumcheck_quadratic — batch variant)
      - crates/backend/koala-bear/src/quintic_extension/packed_extension.rs (batch multiply)
    kill_condition: |
      Kill if: (1) K=8 tiling causes register spill on Zen4 (32 ZMM registers, need
      8×5×2=80 lanes for accumulators — may spill). (2) Measured savings < 1%.
      (3) Loop unrolling defeats auto-vectorization.

  - id: h32
    paper_anchor: |
      1. Setty "Spartan: Efficient and general-purpose zkSNARKs without trusted setup"
         (eprint 2019/550, §5): Separate AIR sumcheck from product opening sumcheck;
         they share the same folding challenges but can partially overlap.
      2. Thaler "Proofs, Arguments, and Zero-Knowledge" (2022, §13):
         Pipeline stages with known data dependencies can overlap at granularity
         finer than whole stages.
      3. Observation: AIR sumcheck (385ms) and GKR (330ms) have distinct data inputs
         but feed into the same Fiat-Shamir transcript sequentially. Within each,
         individual round polynomials must be sequential, but rounds across different
         polynomial instances within a batch can be interleaved.
    mechanism: |
      Overlap DFT with Merkle compress layers using a producer-consumer pipeline.

      Current flow:
        DFT writes full output matrix (2^20 × 115 cols, ~470MB)  → 160ms
        Merkle reads full matrix for first_digest_layer            → 390ms (417ms raw, overlaps)
        Sequential: total ≈ 550ms

      Proposed: Pipeline DFT and Merkle compress.
      The DFT output has 2^20 rows. Partition into C chunks of 2^20/C rows each.
      For each chunk:
        Thread pool A: compute DFT butterflies for this chunk → write to shared buffer
        Thread pool B: hash completed rows from previous chunk → produce digest layer

      With C=8 chunks on 8 cores:
        DFT chunk = 160/8 = 20ms per chunk
        Merkle chunk = 390/8 = 49ms per chunk
        Pipeline: max(DFT, Merkle) + ramp = ~49ms × 8 + 20ms ≈ 412ms (vs 550ms serial)
        Savings: ~138ms = -6.5%

      BUT: the machine has 8 physical cores. Both DFT and Merkle already use all cores
      via rayon. Overlapping them means SHARING cores, not ADDING parallelism. Net effect
      depends on whether the workloads have complementary resource profiles.

      DFT: compute-bound (butterfly arithmetic), moderate memory
      Merkle first_digest: Poseidon-compute-bound, streaming memory access
      Both are compute-bound on the same FMA units. Overlap gains nothing.

      REVISED approach: Overlap DFT with Merkle COMPRESS layers (not first_digest).
      compress_layer is 53ms and is largely memory-bound (reading/writing digests).
      DFT is compute-bound. These COULD benefit from overlap.
      Savings: overlap ~40ms of compress with DFT → -40ms / 2120ms = -1.9%.

      Conservative estimate: -1.5% accounting for synchronization overhead.
    predicted_pct: -1.5
    plumbing:
      - crates/whir/src/merkle.rs:59-87 (build_merkle_tree_koalabear — accept chunked first layer)
      - crates/whir/src/dft.rs:127-141 (dft_layer_par_triple — signal chunk completion)
      - crates/whir/src/commit.rs:63-100 (commit — orchestrate pipelined execution)
      - NEW: shared ring buffer or crossbeam channel for chunk handoff
    kill_condition: |
      Kill if: (1) Synchronization overhead exceeds savings. (2) Core contention causes
      both DFT and Merkle to slow down (check with perf stat). (3) Measured < 1%.

history:
  - id: h30
    paper_anchor: "Dao & Thaler eprint 2025/1117 §5; Plonky3 whir/src/sumcheck/svo.rs"
    mechanism: "SVO-based opening replacing combine_statement + product sumcheck"
    predicted_pct: -16
    status: killed
    kill_reason: |
      Architectural incompatibility. SVO requires per-statement accumulator precomputation
      before batching — Plonky3 builds SVO accumulators per-opening then batches with alpha.
      leanMultisig's combine_statement batches all 15 statements into a single weight buffer
      first, then runs product sumcheck. Retrofitting SVO requires rewriting the entire
      opening phase architecture (VariableOrder, SvoPoint, per-opening partial evaluations).
      Additionally, the fused eq+sumcheck approach (compute_eval_eq_packed_dual_and_sumcheck)
      produced correct weights but incorrect sumcheck accumulators due to an index correspondence
      bug in the thread-pair processing of evals_base chunks. Multiple implementation attempts
      (3 agents + 2 manual attempts) failed to produce correct results.

