  - id: h20
    paper_anchor: "Grassi et al. Poseidon2 eprint 2023/323; Keller & Rosemarin HADES MiMC eprint 2019/1107"
    mechanism: "Fuse consecutive partial rounds into 2-round super-steps"
    predicted_pct: -4.0
    status: discarded
    discard_reason: "Tracing reveals Poseidon permutation is compute-bound at IPC=0.88. Fusing partial rounds only saves intermediate state materialization (~30 memory ops per pair × 10 pairs = 300 fewer per permutation). With 937 cycles/permutation already, 300 memory ops at 4 cycles each = 1200 cycles saved = -0.13%. Below gate threshold. Dead-end for this workload's IPC regime."
