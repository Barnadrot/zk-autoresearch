  - id: h11
    status: infeasible
    reason: |
      Gruen eq extraction (Sec 3.2): ALREADY IMPLEMENTED in leanVM. The compute_bare_round_poly
      already factors out eq(α_i, X) via SplitEq. The expand_bare_to_full only reconstructs for
      Fiat-Shamir batching. Quotient caching (Sec 4): KILLED by memory — 2.3 GB for Poseidon
      (110 cols × 10 × 131K × 16B). Eq-poly split: ALREADY IMPLEMENTED — SplitEq IS the two-table
      decomposition (eq_lo = E_L, eq_hi_packed = E_R). Cost is O(√N) = ~512 ops, negligible vs
      constraint evaluation at O(N×degree) = ~1.3M ops per round.
      Papers: Bagad et al. 2025/1117, Gruen 2024/108, Dao-Thaler 2024/1210.
  - id: h12
    status: infeasible
    reason: |
      SplitEq already IS the two-table eq decomposition from Bagad-Dao-Domb-Thaler Algorithm 5.
      The existing eq_lo field is E_L and eq_hi_packed is E_R. SplitEq::new costs ~2-5μs per round
      vs constraint eval at ~2-8ms per round. Even incremental updates would save < 18μs total
      across 18 rounds. Expected speedup < 0.1%, well below noise floor.
      Papers: Bagad et al. 2025/1117, Dao-Thaler 2024/1210.
  - id: h13
    status: infeasible
    reason: |
      Same as h11 — the eq(α_i, X) factor extraction from Gruen Sec 3.2 is already implemented
      in leanVM's bare_degree()/eq_alpha()/compute_bare_round_poly architecture. The prover already
      computes t_i(X) of degree d=10 (not d+1=11). Reducing bare_degree to 9 would under-interpolate
      the degree-10 constraint polynomial — the constraint degree is the real bottleneck.
      Papers: Gruen 2024/108, Bagad et al. 2025/1117.
