  - id: h2
    name: fused-commit-pipeline
    subsystem: "commit (prover pipeline: DFT -> Merkle data path)"
    paper_anchor: >
      Synthesis (p17+p18+p16): no single paper — composition of leanVM dft.rs 3-layer
      cache-blocking (dft.rs:217-319), merkle.rs first_digest_layer streaming
      (merkle.rs:180-222), and Phase-0 evidence: 41% parallel IPC collapse (1.62->0.95),
      L1d miss > 6%, commit phase = 1.67s of which Merkle 1.30s; codeword = 1 GiB
      materialized then re-streamed; leaf absorb does strided 512B vertical gathers
      (vertically_packed_row_rtl). Cf. BDDT 2025/1117 streaming-prover motivation.
    mechanism: >
      (a) Fuse DFT output with leaf hashing: after the last parallel DFT layer-group,
      absorb each L2-resident tile of 8 leaf-rows directly into the 8-wide packed sponge,
      avoiding materialization of the full codeword (retain leaf matrix only if opening
      requires it — else recompute ~200 queried rows at open time from the retained
      pre-DFT polynomial). Eliminates ~2 GiB of DRAM traffic per commit and the associated
      parallel-IPC collapse. (b) Transpose-tile the absorb path: replace per-absorb strided
      gathers with one in-L1 8x64 tile transpose (vpermt2q/vpunpck) feeding contiguous
      absorbs. (c) Thread the tree climb and first layer with one task per physical core
      pinned chunk (currently rayon-equivalent over 16 logical).
    predicted_pct: -5.5
    plumbing:
      - "crates/whir/src/dft.rs:217-319 (dft_layer_par_triple, last layer-group hook)"
      - "crates/whir/src/commit.rs:64-100 (commit: reorder_and_dft -> MerkleData::build seam)"
      - "crates/whir/src/merkle.rs:59-222 (build_merkle_tree_goldilocks, first_digest_layer_with_initial_state)"
      - "crates/backend/symetric/ (hash_rtl_iter_with_initial_state, MerkleTree::from_first_layer)"
      - "crates/whir/src/matrix.rs (vertically_packed_row_rtl)"
    kill_condition: >
      KILL (a) if perf stat with DRAM-BW/stall counters on the isolated commit phase shows
      memory-stall cycles < 12% of commit cycles (then fusion's 2 GiB saving cannot buy
      > 1% wall); KILL (b) if perf annotate of the leaf-hash closure shows matrix-load +
      shuffle instructions < 12% of its cycles (arithmetic-bound sponge -> tiling is noise);
      KILL (c) if the climb+first-layer phase already saturates 8 cores (per-core util > 85%
      during Merkle span via perf sched/top sampling).
    status: killed_at_plan
    iter: 1
    iter_outcome: >
      Iter 1, killed at plan rung (no implementation). Measured kill conditions:
      KC-2 leaf-hash instruction classification: 91.9% Poseidon arithmetic, <=3.5%
      gather/loads, 2.5% zmm spills (threshold 12%). KC-3 utilization: ~99% busy on
      8 physical cores, FL IPC 1.66 (threshold 85%). KC-1: commit memory stalls
      decompose to reorder ~7% + DFT ~7% + first-layer ~3-5%; fusion saves only
      ~40-50ms. Refined predicted_pct: -0.9 +/- 0.5 — below gate. Leaf hashing is
      Poseidon-throughput-bound; only fewer-committed-cells or a faster permutation
      (protected) can cut it. Plan: report/hypothesis_2/fused-commit-pipeline.md

