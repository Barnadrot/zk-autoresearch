      coset D, |D|=2^k, all constraint evals in base field; verifier interpolates degree
      d(2^k-1) poly; soundness A.4). Composed with §3.2 eq-extraction (p1) and §4
      quotient-reuse (p2) for the remaining multivariate rounds. Cross-component analysis:
      AIR phase = 767ms (20.3% wall); Poseidon8::eval = 14.5% of total cycles; max_full_degree
      = 9 (Poseidon deg-8 +1) drives eval-point count for ALL tables; phase-1 packed-base
      rounds already exist (air_sumcheck.rs:24-32) but post-round-0 folds are EF-valued,
      so rounds 1..k pay C_G ~ 4-6x C_F — the skip eliminates exactly that term:
      cost 2^{n-k}(d-1)(2^k-1)C_F vs current ~sum_{i=1..k} 2^{n-i} d C_G.
    mechanism: >
      Reindex the batched AIR zerocheck domain as D x H_{n-k} (D = size-2^k multiplicative
      coset of Goldilocks*, 2-adicity 32 gives room). Prover round 0 sends one univariate
      poly of degree d(2^k-1) evaluated via base-field-packed constraint evals at
      (d-1)(2^k-1) off-coset points (LDE of each column by factor d along the coset axis);
      verifier interpolates (precomputed barycentric weights), checks consistency, then the
      protocol continues with n-k standard rounds whose tables are already EF-folded once.
      Multi-height tables join via the existing back-loaded suffix alignment: skip variables
      are the n_max-table's top-k bits; smaller tables' claims enter after the skip round
      exactly as they do today after round k. zkdsl verifier: add coset-LDE interpolation
      of the round-0 message + adjust transcript schema; WHIR statements unchanged.
