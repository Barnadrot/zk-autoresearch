      not mul count); BDT 2024/1046 §2.1.2 (ext-mul = 6 base muls for deg-3 Karatsuba,
      reduction cost per product); GL structure 2^64 = 2^32-1, 2^96 = -1 (mod p) allows
      summing 128-bit products before a single reduce128 per output (same trick the
      poseidon1.rs scalar MDS uses with u128 accumulators, poseidon1.rs:85-113 — applied
      here to the cubic Karatsuba combination instead of the MDS row sum).
