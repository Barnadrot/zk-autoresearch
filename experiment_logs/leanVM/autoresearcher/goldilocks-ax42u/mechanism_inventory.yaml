  - id: p34
    name: commitment-grounding-rank-law
    category: pcs
    source: "h9 plan analysis (iter 5): grounding argument over the stacked-PCS + batched-AIR stack"
    mechanism: >
      Every protocol fact about a column is grounded either by a WHIR sparse statement on
      the stacked commitment or by verifier-side recomputation as a polynomial of committed
      columns. k committed columns yield exactly k grounded evaluations per point; n logical
      columns need n. Hence arithmetic packing (c = a + 2^32 b) with n > k is UNSOUND in this
      stack regardless of range-check budget (the cheat (a,b)->(a+2^32 t, b-t) passes every
      opening of c; fact-transfer between points regresses infinitely). SOUND alternatives:
      (i) virtualization — replace a committed column by a low-degree polynomial of other
      committed columns (the nu_a precedent); (ii) small-domain MERGING — one committed
      column decoded by Lagrange polynomials, domain enforced free by a lookup against
      public data (the aux_1 precedent). Binius ring-switching is the only known packing
      escape and needs subfield structure Goldilocks lacks.
    cost_model: "decision law; enabled h9-revised (-6 exec columns with zero range apparatus)"
    assumptions: { pcs: "hash-based multilinear", field: any, arch: any }
    soundness_cost: "n/a (this IS the soundness analysis)"
    composable_with: [p16]
    status: available
    iter_added: 5


  - id: p35
    name: cairo-suffix-sum-flag-packing
    category: pcs   # status corrected iter 6
    source: "Cairo whitepaper 2021/1063 §4.x (instruction flags as prefix/suffix-sum column); read iter 5"
    mechanism: >
      Commit ONE column f-tilde of suffix sums of the flag bits (f-tilde_i = sum_j 2^j f_{i+j});
      each bit is the degree-1 virtual difference f-tilde_i - 2 f-tilde_{i+1}; booleanity =
      degree-2 constraints on differences of one committed column. Grounded under p34
      pattern (ii) (polynomial of committed columns). The bytecode-bus tuple carries the
      single packed word instead of per-flag coordinates -> bus width shrinks too.
    cost_model: >
      CORRECTED (iter-6 h13 analysis kill): LAYOUT-BOUND. Degree-1 bits require every
      suffix cell COMMITTED; in one-row-per-step layouts this is a bus-width optimization
      only (zero committed-cell savings; packed bus word + booleanity ~ -0.2% e2e). In
      Cairo's own 16-rows/step layout it COSTS +N cells and buys constraint count, not
      bytes (2021/1063 §9.4 verbatim). Corollary of p34.
    assumptions: { pcs: any, field: any, arch: any, requires: "bytecode re-encoding; recursion placeholder updates" }
    soundness_cost: none (p34-sound)
    composable_with: [p34, p16]
    status: available
    iter_added: 5

