  # ---- From Wei et al 2025/719 (Packed Sumcheck) ----
  - id: p15
    name: packed-sumcheck-challenge-repetition
    category: sumcheck
    source: "Wei et al 2025/719 §1.1"
    mechanism: >
      Keep ALL sumcheck computation in base field via forward-difference folding + k-fold
      challenge repetition that preserves round-by-round soundness (unlike naive repetition).
    cost_model: >
      O((kd^2+k^2d)N) base muls vs O(kd^2 N) ext ops. For GL (ext mul only 6x base, k=2-3 needed
      for 128-bit from 64-bit base) the arithmetic win is modest (<=1.5-2x on sumcheck portions)
      while verifier/recursion changes are radical (k-fold transcript).
    assumptions: { pcs: any, field: "small base", arch: any, requires: "complete verifier + recursion-circuit rewrite; new soundness analysis vs SECURITY_BITS=128 (protected)" }
    soundness_cost: "repetition-based round-by-round soundness; must re-derive against Johnson-bound regime"
    composable_with: [p4]
    status: available
    iter_added: 1

  # ---- Synthesized from commit-path geometry (Phase 0 profiling + code) ----
  - id: p16
    name: effective-column-commit-scaling
    category: pcs
    source: "synthesis: leanVM commit.rs:71-86 + stacked_pcs.rs layout (Phase 0 finding)"
    mechanism: >
      Stacked vector is column-blocked (64 blocks of 2^{nu-6}); padding lands in trailing
      blocks; DFT runs on dft_n_cols (packing-aligned) and leaf sponge skips zero-suffix
      rate-chunks via precomputed states. Commit cost scales with ACTUAL cells in 2^{nu-6}
      granularity — cell savings pay linearly WITHOUT crossing the nu power-of-2 boundary.
    cost_model: >
      Current: 58/64 effective cols -> 15 perms/leaf. Each 4 column-blocks removed = -1
      perm/leaf (-87ms Merkle) + DFT share. Quantifies ANY future cell-reduction primitive.
    assumptions: { pcs: WHIR, field: any, arch: any }
    soundness_cost: none
    composable_with: [p7, p17]
    status: available
    iter_added: 1

  - id: p17
    name: dft-leaf-hash-fusion
    category: pipeline
    source: "synthesis: dft.rs 3-layer cache blocking x merkle.rs first_digest_layer streaming; motivated by 41% parallel IPC collapse (Phase 0)"
    mechanism: >
      Fuse the last DFT layer-group with Merkle leaf absorption: produce codeword tiles
      L2-resident and absorb them into the 8-wide sponge immediately, never materializing
      the full 1 GiB codeword matrix (keep only leaf rows needed for later openings — or
      recompute opened rows from the retained pre-fold polynomial at query time).
    cost_model: >
      Saves ~1 GiB write + 1 GiB stream-read per commit (~2 GiB of ~60-70 GB/s DDR5 budget
      ~ 30-60ms direct) plus parallel-IPC improvement on the fused phase; RSS -1 GiB.
      Risk: opening path needs leaf rows — must retain leaf matrix OR recompute on open
      (queries are few: ~100-200 rows -> recompute cost trivial).
    assumptions: { pcs: WHIR, field: any, arch: any }
    soundness_cost: none
    composable_with: [p16, p18]
    status: available
    iter_added: 1

  - id: p18
    name: transposed-absorb-tiling
    category: pipeline
    source: "synthesis: merkle.rs vertically_packed_row_rtl strided gathers x cache-blocked transpose"
    mechanism: >
      Leaf hashing reads 8 rows x rate-4 chunks strided by 512B (vertical packing) — a
      transpose-gather per absorb. Pre-transpose tiles (8x64) in L1 via vpunpck/vpermt2q
      once per tile, then absorb from contiguous buffers.
    cost_model: >
      If gather/transpose is >=15% of leaf-hash time (verify via perf: vmovdqu64-from-matrix
      vs arithmetic ratio), tiling recovers most of it: est -100..-200ms of the 1300ms
      Merkle phase. Must measure before implementing.
    assumptions: { pcs: any, field: 64-bit, arch: avx512 }
    soundness_cost: none
    composable_with: [p17]
    status: available
    iter_added: 1

  - id: p20
    name: lagrange-to-tensor-conversion-sumcheck
    category: sumcheck
    source: "synthesis (iter1 T1 discovery): values-on-D skip x weighted-sumcheck basis change; resolves BDT 2024/1046's PCS objection to Gruen's skip"
    mechanism: >
      After a values-on-D univariate skip (block folded with Lagrange weights L_i(r0)), the
      final per-table claims are Lagrange-weighted block combinations — non-tensor. Convert:
      prover recomputes g_c(i) = col_c-MLE(i, x_point) for i in {0,1}^b (one eq-weighted
      pass over original columns), batches columns by RLC gamma, then a b-round weighted
      sumcheck sum_i w(i) g(i) (w = MLE of the Lagrange-weight vector, verifier evaluates w
      from r0 directly) lands a TENSOR point s; per-column evals at (s, x_point) feed the
      PCS unchanged in format.
    cost_model: >
      Prover: ~2^{n_t} muls per column extra (one fold-pass per table, est 30-80ms total at
      benchmark sizes) + negligible 2^b-size sumcheck. Verifier: +b rounds (deg 2) + 2^b-op
      w-MLE eval. Proof: +b x 3 EF coeffs + per-column eval vector (already sent today).
      Soundness: +b·3/|EF| + RLC term — negligible at |EF| = 2^192.
    assumptions: { pcs: "multilinear (WHIR/BaseFold class)", field: any, arch: any, requires: "values-on-D skip round (p3)" }
    soundness_cost: "b·(deg+1)/|EF| + 1/|EF| RLC batching term"
    composable_with: [p3]
    status: closed
    closed_reason: >
      Works as designed (implemented + gate-tested iter 1, commits d82a436d/3954f049,
      reverted f8a4880d) but its ghat per-column duplication (+133 EF here) is half the
      transcript mass that killed p3's family. Closed jointly with p3.
    reopens_on: "any p3 reopening condition; or a PCS accepting Lagrange-basis claims natively"
    latent_parts:
      - "the weighted-block-sumcheck prover/verifier pattern (prove_weighted_block_sumcheck) — generic, transcript-cheap for small b"
      - "PROVEN: Lagrange-fold + terminal conversion preserves PCS statement format (T4' e2e + adversarial tests)" 
    iter_added: 1


  # ---- ITER 2 additions (papers in report/papers/iter_2/) ----
  - id: p21
    name: gray-code-eq-streaming
    category: sumcheck
    source: "Rothblum 2024/1103 Prop 1"
    mechanism: >
      Generate the eq(z,b) sequence in Gray-code order: eq(z, b xor e_i) = ratio_i * eq(z,b)
      with 2m precomputed ratios -> 2^m muls, O(m) space, NO eq table. Any eq-weighted
      streaming pass (MLE eval, g-pass-like folds, on-D accumulations) drops the 2^m-element
      table and its memory traffic entirely. Parallelizable by k-way index partition (Rem 3).
