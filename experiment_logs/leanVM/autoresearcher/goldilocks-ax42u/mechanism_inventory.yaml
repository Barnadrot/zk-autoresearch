  - id: p24
    name: shoup-precomputed-quotient-modmul
    category: pipeline
    source: "Longa-Naehrig 2016/504 §2 (Shoup butterfly); Harvey"
    mechanism: >
      Per fixed twiddle w, precompute w2 = floor(2^64 w / p); then w*x mod p = lo(w*x) -
      lo(hi(w2 * x) * p) + conditional correction: 2 muls + 1 sub, no 128-bit epsilon-reduce
      chain. Twiddles are fixed -> table of (w, w2) pairs.
    cost_model: >
      Goldilocks mul64_64+reduce128 ~ 4 vpmuludq + ~8 ops; Shoup ~ 8 vpmuludq total on
      AVX-512 — roughly break-even on port pressure; WIN is the shorter dependency chain.
      Needs a kernel bench to decide. Doubles twiddle table (cache cost).
    assumptions: { pcs: any, field: 64-bit, arch: avx512 }
    soundness_cost: none
    composable_with: [p22, p23]
    status: available
