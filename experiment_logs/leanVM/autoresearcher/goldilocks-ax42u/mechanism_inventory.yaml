primitives:
  # ---- From Gruen 2024/108 (Some Improvements for the PIOP for ZeroCheck) ----
  - id: p1
    name: eq-factor-extraction
    category: sumcheck
    source: "Gruen 2024/108 §3.2"
    mechanism: >
      Send round polys v'(X) without the eq(alpha,·) factor; verifier reconstructs via
      (1-a_i)v'(0)+a_i v'(1)=v_i. One fewer eval point per round, smaller delta table.
    cost_model: >
      Saves ~1 constraint-eval point per round (deg d+1 -> d) plus N eq-table update muls.
      For leanVM AIR sumcheck (d=9): ~10% of round-eval work if absent.
    assumptions: { pcs: any, field: any, arch: any, requires: "verify leanVM does not already do this (air_sumcheck.rs permuted_alphas suggests partial)" }
    soundness_cost: none
    composable_with: [p2, p3, p8]
    status: available
    iter_added: 1

  - id: p2
    name: quotient-table-round-reuse
    category: sumcheck
    source: "Gruen 2024/108 §4"
    mechanism: >
      Cache Q_i(r,X,x)=C(r,X,x)/X(X-1) tables during round i evals; round i+1's v(0)
      comes from interpolating cached Q instead of fresh constraint evals.
    cost_model: >
      Reduces constraint evals from (d+1)2^{n-1}(C_F+C_G) to (d-1)2^{n-1}(C_F+C_G);
      ~20% fewer C evals at d=9. Extra memory for Q tables (deg d-2 per point).
    assumptions: { pcs: any, field: any, arch: any }
    soundness_cost: none
    composable_with: [p1, p3]
    status: available
    iter_added: 1

  - id: p3
    name: univariate-skip
    category: sumcheck
    source: "Gruen 2024/108 §5-6"
    mechanism: >
      Replace first k sumcheck rounds with ONE univariate round over multiplicative coset D,
      |D|=2^k. All round-0 constraint evals stay in BASE field: cost 2^{n-k}(d-1)(2^k-1)C_F
      + 2^{n-k}(d-1)C_G tail, vs 2^{n-1}d C_F + ~2^{n-1}(d)C_G standard.
    cost_model: >
      For leanVM batched AIR (n=20, d=9, C_G≈4-6 C_F packed): kills nearly all
      EF constraint evals in rounds 1..k. Predicted -50..60% of AIR sumcheck phase (767ms→~350ms).
      Cost: proof +((d-1)(2^k-1)-kd) EF coeffs (~+1-3 KiB), verifier interpolates degree d(2^k-1)
      poly (barycentric, precomputable weights), recursion bytecode grows.
    assumptions: { pcs: any, field: "FFT-friendly (Goldilocks 2-adicity 32 OK)", arch: any, requires: "zkdsl verifier interpolation; multi-height table batching compat" }
    soundness_cost: "RS-style degree bound on first variable; round-by-round soundness preserved (Gruen A.4)"
    composable_with: [p1, p2, p5, p6, p20]
    status: closed
    closed_reason: >
      Iter 1 gate discard (eval_paired 671e6e73 vs 212b5510): wall -5.29% (p~0) and
      recursion -2.22% PASSED, but transcript floor (+1.6% proof: 9(2^k-1)+1 coefficient
      message + ghat per-column duplication from the p20 conversion) costs 4.8 net points
      under the 3x proof-size penalty -> net 0.49 < 1.0. Structural: the k=5 replaced
      window (624.5ms) caps wall savings ~5.3-6%, while minimum transcript ~+1.5% needs
      >=5.65% to clear. k=4 (53ms saved) and k=6 (transcript doubles) strictly worse.
      Closed by gate economics, NOT implementation (implementation exceeded predictions).
    reopens_on: >
      PROOF_SIZE_PENALTY_MULTIPLIER < 2, or gate workload with proofs >= 2 MB (delta
      becomes <0.5%), or a skip variant with o(2^k) transcript (e.g. committed skip
      message opened via the existing WHIR instance), or net-threshold below 0.5%.
    latent_parts:
      - "T1 kernels (lagrange_evals_on_subgroup, block_ifft/coset_evals, coset_sum, horner) — reusable for any coset-structured protocol; reverted but in git history b5ab0b63"
      - "T0 per-round AIR timing data (report/iter1_T0_measurements.md): rounds 0-4 = 624.5ms, poseidon EF-round = 225ms at global round 3 — targets for transcript-free attacks"
      - "T3' engine cost model validated within 5%: on-D pass + off-coset LDE throughput numbers (report/iter1_T3_checkpoint.md)"
      - "Adversarial-prover test harness pattern (skip_adversarial.rs in history d82a436d)" 
    caveat_iter1: >
      PROVEN BY CODE (T1 property tests, commit b5ab0b63): over a multilinear PCS the skip's
      two desiderata are incompatible — the expand_from_univariate curve (which preserves
      tensor claims downstream) does NOT interpolate raw block values on D, so the coset-sum
      check rejects honest provers; the values-on-D interpolant satisfies the coset-sum but
      yields Lagrange-basis (non-tensor) claims the PCS cannot consume. This is the
      "commitment scheme modification" objection in BDT 2024/1046 §1, made precise.
      Resolution: compose with p20 (terminal basis-conversion sumcheck).
    iter_added: 1

  # ---- From Bagad-Domb-Thaler 2024/1046 (Sum-Check over Small Characteristic) ----
  - id: p4
    name: delayed-extension-switchover
    category: sumcheck
    source: "BDT 2024/1046 Alg 3-4"
    mechanism: >
      First i rounds avoid ALL ll (ext-by-ext) muls by expanding round messages as inner products
      of small-value (base) coefficient vectors against challenge tensors; "switch over" to
      linear-time prover after round i via one O(n) base-by-ext binding pass.
    cost_model: >
      Alg4: O((d+1)^i n) base muls replaces O(n) ext muls in rounds 1..i. For GL cubic
      (ll=6 base muls) optimal i ~ 2-3; saves ~40-60% of early-round mul cost where
      multilinears are base-valued (WHIR product sumcheck, GKR layer inputs).
    assumptions: { pcs: any, field: "ext of small base", arch: any }
    soundness_cost: none
    composable_with: [p5, p6, p3]
    status: available
    iter_added: 1

  - id: p5
    name: eq-split-iterated-sum
    category: sumcheck
    source: "Bagad-Dao-Domb-Thaler 2025/1117 §5; Dao-Thaler 2024/1210"
    mechanism: >
      Decompose eq(w,x)=eq(w_L,x_L)·eq(w_R,x_R); precompute two 2^{l/2} tables instead of one
      2^l table; aggregate terms sharing eq(w_L,x_L) before multiplying (x1-prefix aggregation).
    cost_model: >
      Saves ~2N ext muls standalone (~25% of Spartan round-1) or ~N/2 on top of Gruen (~10%).
      Memory 2sqrt(N) vs N. leanVM SplitEq exists — verify whether DT24 aggregation is present.
    assumptions: { pcs: any, field: any, arch: any }
    soundness_cost: none
    composable_with: [p3, p4, p6]
    status: available
    iter_added: 1

  - id: p6
    name: eval-at-infinity
    category: sumcheck
    source: "BDDT 2025/1117 §6.2"
    mechanism: >
      Use the point-at-infinity (leading coefficient) as one round-poly evaluation: products
      of (p_hi - p_lo) terms only; lower-degree terms vanish, halving work for that point.
    cost_model: >
      One eval point per round becomes ~d-fold cheaper (drop additive terms). ~5-10% of
      product-sumcheck round cost.
    assumptions: { pcs: any, field: any, arch: any }
    soundness_cost: none
    composable_with: [p4, p5]
    status: available
    iter_added: 1

  # ---- From Belling-Soleimanian-Bégassat 2022/1072 + Libra 2019/317 + Thaler 2013/351 ----
  - id: p7
    name: gkr-hash-delegation
    category: pcs
    source: "BSB 2022/1072 §3-5; Libra 2019/317 §3"
    mechanism: >
      Prove all N Poseidon permutations via data-parallel GKR with degree-7 custom gates
      (one layer per round); commit only I/O. Removes 86 round-data columns (22.6M cells)
      from the stacked PCS; FS challenges derived from existing commitment (no statement-hash
      problem since I/O is already committed/bus-bound).
    cost_model: >
      Commit: -22.6M cells -> effective_n_cols 58->37 -> Merkle -406ms, DFT -116ms; AIR max
      degree 9->7 and Poseidon8::eval (~500ms) removed. GKR prover adds ~+400-900ms.
      TRANSCRIPT: 30 sequential sbox layers x ~18 rounds x 7-9 EF coeffs ~ 90-120 KiB
      added proof — exceeds +20% proof ceiling (~75 KiB) with 3x penalty.
    assumptions: { pcs: WHIR, field: any, arch: any }
    soundness_cost: "GKR round-by-round soundness fine; none structural"
    composable_with: [p3, p4]
    status: closed
    closed_reason: >
      Proof-size gate: minimum transcript for 30 sequential nonlinear layers (depth cannot be
      compressed below number of sequential sboxes; degree-49 two-round gates make transcript worse)
      is ~90-120 KiB > 75 KiB ceiling; net = throughput(+~15%) - 3x proof(+24%) << 0.
      Architectural, not implementation — hypothesis family closed.
    reopens_on: >
      Proof-size ceiling relaxed, OR a GKR variant with o(depth) transcript (e.g. folded
      layer batching with committed mid-states — partially defeats purpose), OR recursion
      absorbs the aggregate so only recursive proof size matters.
    latent_parts:
      - "effective_n_cols commit scaling: committed-cell reduction pays linearly even without nu-boundary crossing (commit.rs:73-75)"
      - "eq-weighted layer sumcheck = same machinery as existing air_sumcheck (reuse)"
      - "AIR degree-9->7 drop benefits ALL tables' round-eval points"
    iter_added: 1

  - id: p8
    name: data-parallel-wiring-amortization
    category: sumcheck
    source: "Thaler 2013/351; Libra 2019/317 Thm 1"
    mechanism: >
      For C identical sub-circuits, GKR layer sumchecks treat (copy-index, wire-index) as
      separate variable blocks; wiring predicates uniform in copy-index -> prover linear,
      verifier predicate eval O(polylog).
    cost_model: >
      Underlies any per-layer delegation; prover O(gates/layer) with constant ~10-20 base muls.
    assumptions: { pcs: any, field: any, arch: any }
    soundness_cost: none
    composable_with: [p7]
    status: available
    iter_added: 1

