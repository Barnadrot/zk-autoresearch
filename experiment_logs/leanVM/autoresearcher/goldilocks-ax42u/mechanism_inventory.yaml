# Phase gate: >= 15 primitives before implementation.
# Papers read iter 1: report/papers/iter_1/*.pdf (10 of 12)
# Papers read iter 2: report/papers/iter_2/*.pdf (10 fresh: Rothblum 1103 + LN 2016/504 deep;
#   Spartan/HyperPlonk/Jolt/Scribe/BCF-1473/CircleSTARK/Twist-Shout/Binius section-skims)
#   + deep re-read of 2024/1046 Alg 1-4 (killed naive BDT-Alg3/4 for GL cubic: ee/bb=6, be/bb=3
#   -> Alg2 never wins past round 1; their own BabyBear-4 experiments lost at better ratios)
# Papers read iter 3 (dir report/papers/iter_4/ per hook numbering): 12 fresh downloaded,
#   Read-tool deep: ethSTARK 2021/582, tower-sumcheck 2025/594, LogUp 2022/1530, STIR
#   2024/390, Ligerito 2025/1187, DeepFold 2024/1595, Blaze 2024/1609; title/skim: DEEP-FRI,
