      is a cost lever.
    assumptions: { pcs: WHIR, field: any, arch: any }
    soundness_cost: none
    composable_with: [p3, p5]
    status: available
    iter_added: 1

  # ---- From EcGFp5 2022/274 ----
  - id: p10
    name: frobenius-norm-projection
    category: other
    source: "Pornin 2022/274 §3.2"
    mechanism: >
      Extension inversion/Legendre via Itoh-Tsujii norm projection: x^{r-1} by cheap Frobenius
      (coefficient-wise mul by precomputed constants), reducing ext-inversion to base-inversion
      + few ext muls.
    cost_model: >
      Ext inversion ~ 2.6x ext mul. leanVM cubic uses adjugate (comparable); relevant if
      batch-inversions appear in any hot path (they don't currently — WHIR uses no divisions).
    assumptions: { pcs: any, field: "p = 1 mod k helps", arch: any }
    soundness_cost: none
    composable_with: []
    status: available
    iter_added: 1

  - id: p11
    name: schoolbook-vs-karatsuba-add-cost-tradeoff
    category: other
    source: "Pornin 2022/274 §3.2; BDT 2024/1046 fn7"
    mechanism: >
      When adds are not free relative to muls, schoolbook k^2 muls can beat Karatsuba/Toom
      (fewer adds, no small-constant divisions). Toom-3 for cubic = 5 muls + interpolation
      divisions by {2,3,6} — constant divisions are full muls in GL, netting >=7 mul-equivalents.
    cost_model: >
      Confirms leanVM's 6-mul Karatsuba cubic is near-optimal for mul COUNT; the open lever is
      not fewer muls but cheaper reduction per mul (see p12).
    assumptions: { pcs: any, field: 64-bit, arch: any }
    soundness_cost: none
    composable_with: [p12]
    status: available
    iter_added: 1

  # ---- Synthesized from Goldilocks reduction structure + Karatsuba (composition, not retrieval) ----
  - id: p12
    name: deferred-reduction-karatsuba-cubic
    category: other
    source: "synthesis: GL epsilon-reduction (2^64=2^32-1, 2^96=-1 mod p) x Karatsuba combination; cf. polygon-goldilocks avx512 MDS accumulation"
    mechanism: >
      In cubic mul c = a*b: compute the 6 Karatsuba products as unreduced 128-bit (hi,lo)
      pairs; combine c0=m0+m5-m1-m2, c1=m3+m5-m0-2m1, c2=m4+m1-m0 in 128+eps-bit accumulator
      domain (borrow-free via +2p offsets); apply reduce128 ONCE per output coefficient
      (3 reductions instead of 6) and drop intermediate add-canonicalization entirely.
    cost_model: >
      Scalar: reduce128 ~ 5-6 ops of ~18-op mul -> saves ~3x6 ops ~ 20-25% of ext-mul.
      AVX-512: mul64_64 gives (hi,lo) zmm pairs natively; 128-bit lane adds = vpaddq + carry
      via vpcmpltuq (2 ops); net ~20-30% of packed ext-mul. cubic_mul = 17% of cycles ->
      predicted -3.5..-5% wall. Risk: extra live zmm pairs raise register pressure.
    assumptions: { pcs: any, field: 64-bit, arch: "avx512 preferred, scalar too" }
    soundness_cost: none
    composable_with: [p4, p5, p11, p13]
    status: closed
    closed_reason: >
      Iter 2 measured: (a) standalone packed ext-mul rewrite = +5..13% MORE instructions
      (AVX-512 lacks ADC; plan §1.6 op-count, pre-implementation); (b) ext-ext quadratic
      accumulation KILLED at every production-live site (T5': GKR -2.4% / WHIR +5.5% ->
      combined +1.7% regression — accumulator-state traffic (4 zmm x 3 coeffs) exceeds the
      9.6% op saving at real sizes). Only the base-x-ext dot-product shape survived (see
      p13 latent_parts).
    reopens_on: >
      An ISA with 64-bit add-with-carry in SIMD (AVX-512 ADX-equivalent, or AMX-class
      accumulators), or kernels with >= 3x more terms per accumulator per byte streamed.
    latent_parts:
      - "T1-T3 lazy-accumulator trait vocabulary (commits 9d01759b/6789552e/caf1109c in history): correct, tested, zero-spill — recoverable for any future amortized-reduction kernel"
      - "T4 vectorized base-x-ext round-1 kernel (5ddf2fcc): VERIFIED -8.6% span / -0.85% e2e, proofs byte-identical — re-land candidate inside a properly-sized hypothesis"
    iter_added: 1

  - id: p13
    name: lazy-canonicalization-accumulators
    category: other
    source: "synthesis: redundant-form GL (goldilocks.rs non-canonical u64) x sumcheck accumulation patterns"
    mechanism: >
      Sumcheck inner loops accumulate sums of products; keep accumulators in redundant
      (hi,lo) or u128 form across the loop body, reduce once per output instead of per
      operation; valid since term counts <= 2^k keep accumulators < 2^{128-eps}.
    cost_model: >
      Removes per-add overflow-check (vpcmpltuq+mask-sub ~ 3 ops per add) in dot-product
      shaped kernels (eval_eq, fold, MDS-like sums). Est -1..-3% wall depending on coverage.
    assumptions: { pcs: any, field: 64-bit, arch: any }
    soundness_cost: none
    composable_with: [p12]
    status: available
    iter_added: 1

