      Merkle span (~300ms on 1220ms!). If leaf already spans row-group (~64): overhead
      ~6%, lever dead. Costs per query: +leaf bytes in proof, +leaf absorbs in recursion
      circuit, -log(w ratio) path hashes. Net rule: proof delta x3 penalty — compute with
      actual query count + digest size before any plan.
    assumptions: { pcs: "Merkle/FRI-family", field: any, arch: any }
    soundness_cost: none (layout change; componentwise fold checks)
