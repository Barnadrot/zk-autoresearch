current_pool:
  - id: h5
    name: uniskip-bottom-gkr-layer
    paper_anchor: >
      Gruen eprint 2024/108 §5 (same mechanism, new target) + Papini-Haböck
      2023/1284 §3.2 (layer sumcheck structure: deg-3 products over
      eq·(p_a·q_b + p_b·q_a, q_a·q_b)). The bottom logup-GKR layer is the
      largest (2^24 this workload; prove GKR = 218ms = 10.8% e2e); its first k
      rounds pay EF-vs-base penalties wherever leaf factors are base field
      (numerators are multiplicities/counts; denominators are EF fingerprints).
      Front-loading is NOT needed (single sumcheck per layer).
    mechanism: >
      Apply the univariate skip to the FIRST (largest) layer sumcheck of the
      logup quotient GKR only: reinterpret the leaf numerator/denominator
      multilinears over D x H_{n-k}, send one combined coefficient vector
      (degree (2^k-1)*3 = 45 at k=4, +46 EF transcript), bind k variables with
      one challenge. Saves the EF-round tail of the largest layer; upper layers
      unchanged. Verifier + python spec + recursion circuit mirror (one extra
      branch in the gkr verification round 1).
    predicted_pct: -0.6  # double-downgraded: h8 diagnostic measured ~40% compute->wallclock conversion in the GKR/WHIR memory-bound region; bottom-layer ~25ms compute saving converts to ~10ms e2e -> BELOW GATE; entry retained only as documentation pending triage-kill unless iter-4 profiling contradicts the conversion factor  # was: downgraded from -2.0: bottom-layer sumcheck measured 70-78ms (h5-measure, iter2 phase1); den-side d*d products are EF at every round incl. the window, so the skip accelerates only the num side
    plumbing:
      - "crates/sub_protocols/src/quotient_gkr/ (bottom-layer prover + verifier)"
      - "crates/lean_prover/python-verifier/verifier.py verify_gkr_quotient"
      - "crates/rec_aggregation/zkdsl_implem/recursion.py (gkr section)"
    kill_condition: >
      Profile attribution shows the bottom GKR layer is <40ms of the 218ms GKR
      span (add a temporary per-layer tracing span and run once) - then max win
      <1% and the transcript+recursion cost is not paid back. Also kill if BOTH
      leaf factors are already extension-field at the bottom layer (read
      quotient_gkr leaf layout first): then the skip saves only the eq factor
      and dies.
  - id: h6
    name: poseidon-output-regating-degree-9
    paper_anchor: >
      Phase-0 code analysis (tables/poseidon/mod.rs:296-301 + 488-522): AIR
      degree is 10 ONLY because eval_last_2_full_rounds_16 gates the degree-9
      permutation tail by linear flags (gate_lo_8, gate_hi). Max table degree
      drives the batched sumcheck z-point count (10 eval points per pair per
      round for poseidon; combined verifier degree 11; skip-poly degree 150).
      Gruen 2024/108 cost model: prover work linear in d.
    mechanism: >
      Restructure the output constraints so every constraint has degree <=9:
      commit out_lo/out_hi as the UNGATED permutation(+feedforward) outputs and
      move mode selection to the bus/trace side (the memory lookups already
      select which output cells are consumed; trace_gen defines the committed
      values for unused cells). Poseidon AIR degree 10 -> 9, combined sumcheck
      degree 11 -> 10: one fewer z-point every round AND one fewer EF coeff per
      linear round, skip poly degree 150 -> 135 (-16 EF transcript each).
      Requires degree_air() change (Layer 0.7 Check-3 protected method ->
      human-review posture, same as iter 1) + recursion MAX_AIR_FULL_DEGREE
      recompile.
    predicted_pct: -0.8  # downgraded by the pre-wiring soundness sketch (report/hypothesis_6/soundness_sketch.md): post-h1/h4 the degree drop saves only ~15ms in the AIR region, and the 'small regating' actually requires logup-wide multiplicity-column changes; BELOW GATE -> triage-kill territory per operator h7 rule
    plumbing:
      - "crates/lean_vm/src/tables/poseidon/mod.rs (eval_last_2_full_rounds_16, degree_air, trace_gen.rs)"
      - "crates/rec_aggregation zkdsl + compilation.rs (degree constant)"
      - "crates/lean_prover/python-verifier/verifier.py (degree + eval_air mirror)"
    kill_condition: >
      Write the candidate constraint system down BEFORE wiring: if mode-selection
      soundness (out4/out8/permute) cannot be enforced without the gating
      multiplications - i.e., a hand-built adversarial witness with mismatched
      mode flags passes all bus + AIR checks in a soundness_check-style unit
      test - the family is dead. Also kill if padding rows (multiplicity 0 but
      out columns pulled by 16 memory lookups) cannot satisfy the ungated
      equality with any trace_gen definition.

