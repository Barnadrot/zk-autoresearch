current_pool:
  - id: h3
    paper_anchor: >
      Speeding Up Sum-Check eprint 2025/1117 §1.1 (small-value optimization,
      Algorithm 3/4), §4.2 (eq-poly split optimization),
      Sumcheck Time-Space Tradeoff eprint 2024/524 §4 (BlendySC algorithm),
      SP1 Poseidon2 AIR (crates/hypercube/poseidon2/ — degree 3 reference)
    mechanism: >
      Exploit that leanVM trace columns are KoalaBear (31-bit) values while the
      AIR sumcheck operates in the 155-bit quintic extension. In early sumcheck
      rounds, column values are base-field packed, and multiplications are sl
      (small x large) not ll (large x large). Implement Algorithm 3 from Bagad
      et al.: precompute products of small-value columns and use Toom-Cook
      interpolation to avoid ll mults in the first ~12 rounds. Additionally
      optimize SplitEq via half-table precomputation (eq-poly optimization §4.2).
      Combined: 2-3x speedup of AIR sumcheck inner loop. Since AIR sumcheck is
      ~25% of total (post-iter1), this yields 6-12% e2e improvement.
    predicted_pct: -8
    plumbing:
      - crates/sub_protocols/src/air_sumcheck.rs:311-557
      - crates/backend/sumcheck/src/split_eq.rs
      - crates/backend/sumcheck/src/sc_computation.rs
    kill_condition: >
      If profiling the modified inner loop shows small x large multiplication
      savings are less than 30% of the original large x large cost per round
      (measurable: instrument compute_raw_poly with cycle counters, compare
      per-round cost before/after), the optimization is not engaging.

  - id: h4
    paper_anchor: >
      Same as H2 (Power Circuits eprint 2023/1611, LogUp-GKR eprint 2023/1284).
      Continuation of the column-removal strategy validated in iter 1.
    mechanism: >
      Remove ending_full_rounds[0] (16 columns) from Poseidon AIR using the
      same GKR approach as iter 1. The AIR currently goes: beginning_full_rounds[0]
      → partial rounds → ending_full_rounds[0] → last 2 full rounds → output.
      Removing ending_full_rounds[0] requires either (a) a GKR proving the first
      2 final rounds from partial-round output, which needs a committed bridge
      column (+16 cols, net 0), or (b) extending the GKR to cover ALL 4 final
      rounds plus output linking, removing ending + last-2-rounds from AIR.
      Option (b): 94 → 78 columns, degree_air drops to 9 (only partial-round
      checkpoints + beginning checkpoint remain, all degree ≤ 9). Combined with
      degree reduction: ~10% additional improvement.
    predicted_pct: -10
    plumbing:
      - crates/lean_vm/src/tables/poseidon/mod.rs:367-454
      - crates/lean_vm/src/tables/poseidon/trace_gen.rs
      - crates/sub_protocols/src/poseidon_gkr/prover.rs
      - crates/lean_prover/src/prove_execution.rs
      - crates/lean_prover/src/verify_execution.rs
    kill_condition: >
      If the final GKR (covering 4 final full rounds + output linking) requires
      handling flag_permute/flag_out4/flag_out8 conditional logic within the GKR
      circuit, and this adds >50% overhead to the GKR per-layer cost compared
      to the unconditional CubeAddRC layers, the complexity may not be worth it.
      Measure: time the final GKR standalone and compare to iter1 initial GKR.

  - id: h5
    paper_anchor: >
      LogUp-GKR eprint 2023/1284 §3.3 (computational cost),
      On Efficient Compression Modes eprint 2024/047 §5 (Merkle tree arity)
    mechanism: >
      Reduce the number of Poseidon bus interactions from 33 to ~17 by using
      wider memory lookups. Currently each 4-element or 8-element memory group
      creates separate bus entries. If memory lookups were batched (e.g., 8
      elements per bus entry instead of 1), the LogUp data would shrink by ~2x,
      reducing GKR quotient proving time (~11% of total). This requires changing
      the bus protocol to support wider tuples.
    predicted_pct: -5
    plumbing:
      - crates/lean_vm/src/tables/poseidon/mod.rs:150-182
      - crates/lean_vm/src/tables/table_trait.rs
      - crates/sub_protocols/src/logup.rs
      - crates/lean_prover/src/verify_execution.rs
    kill_condition: >
      If wider bus tuples require increasing bus_width beyond 16, which would
      increase LOG_MAX_BUS_WIDTH and the alphas_eq_poly size, the LogUp
      fingerprint cost per entry may increase enough to negate the savings from
      fewer entries. Check: compute new bus_width requirement.

