# Mechanism Inventory — append-only across iterations
#
# Each paper decomposes into 2-4 typed primitives. The inventory is the
# combination space: more primitives = more composition opportunities.
# Phase gate requires >= 15 primitives before implementation.
#
# Kill ladder (each rung ~10x cheaper than the next):
#   paper math -> primitive-op bench -> in-pipeline compute-and-discard stub -> implementation
# Kill at the cheapest rung that produces a decisive answer.
#
# Iter-1 papers read (13): power_circuits (Soukhanov'23), doubly_efficient (Virgo++ ZLWZSXZ'21),
# speedup_sumcheck (Bagad-Dao-Domb-Thaler'25), libra (XZZPS'19 2019/317), logup_gkr
# (Papini-Haboeck 2023/1284), gruen_zerocheck (2024/108), thaler13 (2013/351),
# poseidon1 (GKRRS updated), smallchar_sumcheck (BDT 2024/1046), daothaler_sumcheck_opts
# (Dao-Thaler'24), sumcheck_tradeoff (Chiesa-Fedele-Fenzi-ZE 2024), estark (2023/474),
# compression_modes (Andreeva-Bhattacharyya-Roy-Trevisani CSF'24).

primitives:
  - id: p1
    name: power-circuit-arithmetization
    category: sumcheck
    source: "Soukhanov 2023 (power_circuits) Def 1, Thm 1"
    mechanism: >
      GKR layer relation W_{i+1}(y) = sum_x M_i(y,x) W_i^{d_i}(x) + C_i(y): affine maps +
      power gates replace add/mul wiring. One Poseidon round = exactly one d=3 power layer
      (RC affine + cube + MDS matrix). Halves communication vs vanilla GKR wiring (single
      variable set, log2(2c+q) rounds/layer, degree-3 messages).
    cost_model: >
      Per layer: sumcheck over layer logsize with degree-(d+2) round polys. For Poseidon-16
      full rounds at 2^18 perms: layer = 2^22 wires, ~22 rounds/layer. Communication
      ~7*mu_i per layer (vs 2 claims + combine in vanilla).
    assumptions: {pcs: any, field: any, arch: any, requires: "uniform/log-evaluable wiring MLE"}
    soundness_cost: "standard sumcheck d/|EF| per round; negligible at |EF|=2^155"
    composable_with: [p4, p6, p7, p8]
    status: available
    iter_added: 1

  - id: p2
    name: squaring-circuit-mul-elimination
    category: sumcheck
    source: "Soukhanov 2023 (power_circuits) Thm 1"
    mechanism: >
      Any mul gate emulated by squares: ab = ((a+b)^2 - a^2 - b^2)/2; circuit size 2c+q,
      enables single-variable-set sumchecks per layer (no x,y double cube).
    cost_model: "2x layer size for non-homogeneous circuits; ~2x communication drop when wiring sparse"
    assumptions: {pcs: any, field: "char > 2", arch: any}
    soundness_cost: none
    composable_with: [p1]
    status: available
    iter_added: 1

  - id: p3
    name: gkr-block-vs-commit-duality
    category: pipeline
    source: "GKR (Goldwasser-Kalai-Rothblum), Thaler 2013/351 §5, leanVM air_sumcheck.rs"
    mechanism: >
      Any checkpointed AIR block (commit W_{i+1}, zerocheck G(W_i) - W_{i+1} = 0) can instead
      be proven GKR-style (sumcheck-reduce claim about W_{i+1} to claim about W_i, never
      committing W_{i+1}). Trades committed cells against per-block sumcheck ladders +
      transcript rounds.
    cost_model: >
      Eval FLOPs are EQUAL both ways (same pairs-sum x z-points x gate cost); the trade is
      pure commit-cells vs transcript/recursion. leanVM poseidon: removing 80 checkpoint cols
      saves 21M cells (~-185ms commit, no nu crossing) but adds >= 4 ladders x ~22 rounds x
      deg-10 polys in-circuit => recursion +5-10% >> 3% ceiling. KILLED at paper-math rung.
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: "sumcheck error per added ladder round; negligible"
    composable_with: [p1, p7]
    status: closed
    closed_reason: >
      Rung-1 paper math (iter 1): eval side does not improve (identical FLOP structure incl.
      EF-creep after round 1 of each ladder); commit saving -185..-340ms is paid for with
      +0.9k..3k EF of in-circuit transcript reads + univariate evals across 4-28 ladders;
      recursion regression blows the 3% eval_paired ceiling => forced discard. nu 26->25
      crossing needs <= 8 committed poseidon cols, unreachable while buses need 10 control
      cols + logup leaf anchors.
    reopens_on: >
      (a) recursion ceiling lifted or in-circuit sumcheck verification gets >= 5x cheaper
      (e.g. batch-verification of ladder rounds); (b) a workload where poseidon table is
      >= 60% of cells so nu crossing pays for the transcript; (c) aggregation topology
      amortizing one ladder across many proofs.
    latent_parts:
      - "fused 2-full-rounds degree-9 custom gate = exactly the existing eval_2_full_rounds block; reusable if a ladder is ever cheap"
      - "partial-round chain cannot be layered without 20 width-1 layers or committing u_j: any GKR-for-poseidon must keep the partial block AIR-style"
    iter_added: 1

  - id: p4
    name: libra-two-phase-layer-sumcheck
    category: sumcheck
    source: "Libra 2019/317 §3.3 (Lemma 2, SumCheckProduct)"
    mechanism: >
      Per GKR layer, split the 2ell-variable sumcheck into two ell-round phases with
      bookkeeping tables h_g(x) = sum_y f1(g,x,y) f3(y) initialized from wiring sparsity;
      each phase is a product-of-two-multilinears sumcheck.
    cost_model: "O(2^ell) per layer; ~12-20 EF muls/gate vanilla (tables init + 3-pt evals per round)"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p1, p8, p10]
    status: available
    iter_added: 1

  - id: p5
    name: virgo-general-circuit-sumcheck
    category: sumcheck
    source: "Virgo++ (doubly_efficient, ZLWZSXZ CCS'21) abstract+§1"
    mechanism: >
      Single sumcheck equation reduces a layer-output claim to input-only claims for
      NON-layered circuits (gates may read any earlier layer), keeping prover linear in
      circuit size — avoids relay-gate blowup for skip-level wiring.
    cost_model: "O(C) prover, no depth-proportional relay overhead; constants larger than layered Libra"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: "standard sumcheck terms"
    composable_with: [p1, p4]
    status: available
    iter_added: 1

  - id: p6
    name: thaler13-regular-wiring-linear-prover
    category: sumcheck
    source: "Thaler 2013/351 Thm 1, §5.4 (reusing work)"
    mechanism: >
      For circuits whose in1/in2/type predicates are 'regular' (O(1)-time, bit-local),
      the GKR prover runs in O(S) total via V^(j) arrays reused across rounds; data-parallel
      circuits (N copies of one sub-circuit) qualify — Poseidon's per-perm uniform wiring fits.
    cost_model: "O(S_i + S_{i+1}) per layer; 200-250x measured vs CMT at the time"
    assumptions: {pcs: any, field: any, arch: any, requires: "regular wiring predicates"}
    soundness_cost: none
    composable_with: [p1, p7, p8]
    status: available
    iter_added: 1

  - id: p7
    name: custom-low-degree-gkr-gates
    category: sumcheck
    source: "Thaler 2013/351 Remark 7 (citing CMT §3.2)"
    mechanism: >
      GKR layers may use arbitrary low-degree gates (not just add/mul): a degree-d gate
      raises round-poly degree to d+1 but collapses d layers of depth into one — e.g. one
      full Poseidon round (cube+MDS) or a 2-round block (degree 9) as a single gate.
    cost_model: "round-poly degree d+1 => d+1 evals/pair/round vs depth-many ladders; transcript shrinks by fused depth"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: "(d+1)/|EF| per round"
    composable_with: [p1, p3, p16]
    status: available
    iter_added: 1

  - id: p8
    name: bdt-small-value-first-rounds
    category: sumcheck
    source: "Bagad-Dao-Domb-Thaler speedup_sumcheck Fig.1 Algos 3/4, §1.1"
    mechanism: >
      For sumchecks over PRODUCTS of multilinears with small/base-field values, replace
      ll (EFxEF) muls in early rounds by expanding into inner products with small-value
      coefficient vectors (Algo 3: O(2^{d i}) ss-muls; Algo 4 Toom-Cook variant: O((d+1)^i));
      switch back to linear-time prover when overhead crosses.
    cost_model: >
      Reduces dominant ll-mul count by ~kappa^0.63 (kappa = ll/ss ratio; KoalaBear quintic:
      ll ~ 15-25 ss). Applies to: WHIR product sumcheck, GKR layer products, LogUp fraction
      ladders. NOT directly to non-product AIR constraint evals.
    assumptions: {pcs: any, field: "small base inside extension OR small values in large prime", arch: any}
    soundness_cost: none
    composable_with: [p4, p9, p10, p16, p17]
    status: available
    iter_added: 1

  - id: p9
    name: bdt-eq-two-table-split
    category: sumcheck
    source: "speedup_sumcheck §1.1 Eq-Poly Optimization (Eq. 2)"
    mechanism: >
      Factor eq(w,X) = eq(w_L)·eq(w_R) and rewrite round message as iterated sum so the
      prover precomputes two 2^{l/2} tables instead of one 2^l eq table; first l/2 rounds
      use the small tables.
    cost_model: "eliminates 2^l eq-table build + most eq muls in first half of rounds; memory 2*2^{l/2}"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p8, p11, p14]
    status: available
    iter_added: 1

  - id: p10
    name: delayed-ef-slice-representation
    category: sumcheck
    source: "BDT smallchar 2024/1046 Algs 3-4"
    mechanism: >
      After binding k variables to EF challenges, keep folded polynomials as 2^k BASE-field
      slices with EF coefficients: products against EF data run as (base x EF) per slice
      (5 base muls each for quintic) with a single EF dot at the end, instead of full EFxEF.
    cost_model: >
      Profitable while n_slices*5 < EFxEF cost (~15-25): 1-2 delayed rounds for KoalaBear.
      Collapse pass = n_slices basexEF per element, once.
    assumptions: {pcs: any, field: "31-bit base in quintic EF", arch: any}
    soundness_cost: none
    composable_with: [p8, p16, p17]
    status: available
    iter_added: 1

  - id: p11
    name: gruen-eq-factor-bare-poly
    category: sumcheck
    source: "Gruen 2024/108 §3.1-3.2"
    mechanism: >
      Zerocheck round poly sent 'bare' (eq factor divided out): degree drops by 1, z=1
      deduced from running sum; eq factor restored by verifier. Cost
      ~2^{n-1}(d-1)C_F + 2^{n-1} d C_G.
    cost_model: "saves 1 eval point + 1 transcript coeff per round; 5/3x for d=3"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p9, p12, p14]
    status: used   # already deployed in leanVM air_sumcheck.rs (p_at_1 deduction + eq_alpha)
    iter_added: 1

  - id: p12
    name: gruen-q-multilinear-quotient-table
    category: sumcheck
    source: "Gruen 2024/108 §4 (Eq. 2, §4.2)"
    mechanism: >
      Maintain Qbar_i(r,x) = the MULTILINEAR extension of C's restriction (long-division
      quotient accumulation): C(r,X,x) = Qbar_{i-1}(r,X,x) + X(X-1) Q_i(r,X,x). Since Qbar
      is multilinear, the z=0 (and z=1) evaluations of C in every round come from the Qbar
      table with 1 mul/pair instead of a full constraint evaluation. Transcript-identical.
    cost_model: >
      Saves 1 of the (d) full C_G evals per pair per EF round (leanVM poseidon: 1 of 10
      z-points ~ 10% of EF-round eval ~ 8% of poseidon AIR eval ~ -35ms) at ~2(d-1) muls/pair
      bookkeeping + one EF table of current size (halving per round). Applies to ALL tables.
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p11, p14, p18]
    status: available
    iter_added: 1

  - id: p13
    name: univariate-skip-first-rounds
    category: sumcheck
    source: "Gruen 2024/108 §5.1"
    mechanism: >
      Replace base hypercube by D x H_j (|D|=2^k multiplicative subgroup): first k rounds
      collapse into one univariate round of degree d(2^k - 1), all in base field.
    cost_model: "2^{n-k}(d-1)(2^k-1) C_F replaces first-k-rounds C_G work"
    assumptions: {pcs: "commitment must support high-degree first variable", field: "small char", arch: any}
    soundness_cost: "d(2^k-1)/|EF| first round"
    composable_with: []
    status: closed
    closed_reason: >
      USER CONSTRAINT (2026-06-12): implemented by another agent on myfork/pw13-clean;
      ~90% it will NOT merge; neither implementing NOR composing with it is a valid target
      here. Also the WHIR initial-sumcheck product-skip variant (pw13-3 V1-V5,
      myfork/pw13-hetzner) was tried and REVERTED — that family is disproven.
    reopens_on: "explicit user instruction only"
    latent_parts: []
    iter_added: 1

  - id: p14
    name: dt24-eq-cost-elimination
    category: sumcheck
    source: "Dao-Thaler 'More Optimizations to Sum-Check Proving' abstract+§1"
    mechanism: >
      Improvement over Gruen's eq handling: eliminates ~2^{n+1} muls vs standard prover and
      ~2^{n-1} on top of Gruen in the eq(w,x)*p(x) setting, via restructured round-message
      computation; combinable with BDT small-field optimizations.
    cost_model: "~10% prover saving on top of Gruen in common d=2-3 cases; more over binary towers"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p9, p11, p12]
    status: available
    iter_added: 1

  - id: p15
    name: logup-gkr-fractional-ladder
    category: lookup
    source: "Papini-Haboeck 2023/1284 §3.3"
    mechanism: >
      LogUp fractional sums proven by a GKR ladder of projective fraction additions
      (a0,b0)+(a1,b1) = (a0 b1 + a1 b0, b0 b1); per-layer degree-3 eq-weighted sumchecks.
    cost_model: "~43 muls + 29 adds per bottom-layer element across the whole ladder; bottom two layers ~75% of gate work"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: "3/|EF| per round, union over layers"
    composable_with: [p8, p10, p16]
    status: used   # leanVM quotient_gkr implements this
    iter_added: 1

  - id: p16
    name: wide-leaf-4ary-fraction-gate
    category: lookup
    source: "derived: 2023/1284 §3.3 x Thaler13 Remark 7 (custom gates); h3 plan iter-2"
    mechanism: >
      Replace the two bottom (largest) LogUp-GKR layers with ONE sumcheck whose gate is the
      4-ary fraction combine (num = sum of 4 cross products, den = d0d1d2d3): degree-g
      (g in 4..6, pinned analytically) eq-weighted round polys; continuation re-enters the
      standard ladder 4x smaller.
    cost_model: >
      Removes 2 projective-add layer builds (3 EFxEF muls + 1 add per output at 2^24+2^23)
      + the two fattest compute_round_packed passes (~8% busy total); pays g-1 extra eval
      points/round on the fused axis + (g_bare-2) EF/round transcript. Delayed-EF (p10) on
      base-field numerators keeps the wide gate under budget.
    assumptions: {pcs: any, field: any, arch: any, requires: "verifier + python + zkDSL mirrors updated; recursion recompile"}
    soundness_cost: "g/|EF| per fused round vs 3/|EF| x2 layers — ~1.4 bits inside a 146-bit margin"
    composable_with: [p10, p8, p15]
    status: closed
    closed_reason: >
      Rung-1 paper math (iter 1): wide step ~335M EF-muls vs ~184-218M replaced (degree-4
      gate x 4 points vs degree-2 x 2 over once-halved visits); build delta a wash. Net
      prover +0.4-0.6% e2e. ARCHITECTURAL: fusing k product-ladder layers multiplies
      per-visit cost ~2^k while visits halve once — can never reduce prover arithmetic.
      See report/hypothesis_3/gkr-bottom-fusion-rung1-kill.md.
    reopens_on: >
      A gate that rewards recursion/verifier time or transcript size (fusion gives
      -50 EF recursion transcript + one fewer in-circuit ladder loop, g=4 pinned).
    latent_parts:
      - "bare gate degree derivation g=4 (full 5) for 4-ary projective combine — reusable"
      - "transcript ledger: rust (23+24)x2+8 -> 23x4+8 EF; mirrors 196 -> 146 EF"
    iter_added: 1

  - id: p17
    name: lazy-weight-provider
    category: pcs
    source: "derived: CTY11 streaming prover lineage (via speedup_sumcheck §1.2 related work) x leanVM SplitEq; h2 plan iter-2"
    mechanism: >
      WHIR initial sumcheck: never materialize the 1.34 GB combined weight
      w = sum_s gamma^{k_s} weight_s; evaluate it chunk-wise inside the round-0 pass from
      per-statement SplitEq prefix/suffix tables (tens of MB), fused with the round-0 fold.
    cost_model: >
      Removes one 1.34 GB write + one 1.34 GB read (combine_statement 121ms + part of
      product 154ms); pays in-register recompute ~ (n_statements x 2 muls)/element single
      pass. Bit-identical transcript (exact field ops, fixed gamma-power accounting).
    assumptions: {pcs: WHIR, field: any, arch: "packing_width > 1"}
    soundness_cost: none
    composable_with: [p8, p10, p9]
    status: available
    iter_added: 1

  - id: p18
    name: fold-fusion-single-pass
    category: sumcheck
    source: "Chiesa-Fedele-Fenzi-ZE 2024 (time-space family) x leanVM product_computation fold_and_compute pattern"
    mechanism: >
      Fuse the post-challenge fold (lerp lo + r(hi-lo)) into the NEXT round's eval pass
      (read pairs once, emit folded values + round-poly contributions together), eliminating
      one full memory pass over the multilinear group per round. leanVM already does this in
      the WHIR product sumcheck (fold_and_compute_product_sumcheck_polynomial) but NOT in
      the AIR sessions (fold_at_bit is a separate pass over ~110 EF-packed columns).
    cost_model: >
      AIR sessions: saves write+read of ~110 cols x 2^(17-r) EFPacking per round
      ~ 1.1 GB cumulative ~ -30..-50ms; zero FLOP change; transcript-identical.
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p12, p11, p17]
    status: available
    iter_added: 1

  - id: p19
    name: pgv-elc-wide-arity-merkle
    category: pipeline
    source: "Andreeva-Bhattacharyya-Roy-Trevisani CSF'24 (compression_modes)"
    mechanism: >
      Blockcipher-based AO compression modes (PGV-LC/ELC) + wider Merkle arity: up to 9x
      native MT construction vs Poseidon binary MTs.
    cost_model: "large native gains, but replaces the hash primitive + changes MT shape"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: "ideal-cipher-model bounds, NOT the proven Poseidon sponge regime"
    composable_with: []
    status: closed
    closed_reason: >
      Hard constraint 3 (no migration off Poseidon1) + protected WHIR/recursion structure;
      leanVM already uses arity-8-equivalent wide sponge leaves + 2-to-1 compress climb,
      packed 8-wide (verified merkle.rs:76-217, PFPacking vertically-packed rows).
    reopens_on: "constraint 3 lifted"
    latent_parts:
      - "leaf-width economics: -1 sponge chunk per -4.2M committed cells remains THE commit lever"
    iter_added: 1

  - id: p20
    name: estark-eair-degree-control
    category: other
    source: "eSTARK 2023/474 abstract/§1"
    mechanism: >
      Degree control trade between AIR representation (more columns, lower degree) and
      protocol (higher degree, fewer columns); eAIR formalizes arguments alongside.
    cost_model: >
      For leanVM poseidon: checkpoint-every-1-round = +64 cols = +16.8M cells -> crosses
      nu 26->27 (DOUBLES commit) — dead; checkpoint-every-3-rounds = degree 27 -> 27
      z-points — dead. Current 2-round blocks are the Pareto point on the nu boundary.
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p12]
    status: closed
    closed_reason: "paper-math rung: both directions off the current 2-round checkpoint Pareto point lose (nu crossing up, or z-point blowup)"
    reopens_on: "nu headroom changes (workload shape) or degree-split generalization to multi-level caching"
    latent_parts:
      - "degree-split low_degree_block caching (already in leanVM) is the 1.5-level version of this trade"
    iter_added: 1

  - id: p21
    name: sumcheck-time-space-knobs
    category: sumcheck
    source: "Chiesa-Fedele-Fenzi-Zitek-Estrada 2024 (sumcheck_tradeoff)"
