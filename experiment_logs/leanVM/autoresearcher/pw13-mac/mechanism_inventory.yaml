  - id: p22
    name: aligned-block-memory-tiers
    category: lookup
    source: "h-mw Plan-agent census iter-1 (report/hypothesis_4/); logup.rs:387-401 bytecode fold"
    mechanism: >
      For k=2^c ALIGNED memory blocks, the k-value bus fingerprint collapses verifier-side to
      ONE plain evaluation claim m(t ++ alphas[4-c..]) via the existing bytecode-fingerprint
      fold — no new WHIR weight kind. Two-tier (cell + block) memory buses with independent
      multiplicity columns are sound; alignment is completeness-only. GKR cost ∝ active leaf
      length.
    cost_model: >
      Aligned two-tier: tuples 19.66M -> 14.16M (-28%), gkr_n_vars 25->24, net ~ -41ms BEST
      case. Unaligned: +6.7% worse (dense stride-1 tiers). Alignment migration: +0.3-0.7M
      memory cells vs 283k headroom -> log_memory 23 cliff erases gain + breaches 2^26 stacked.
    assumptions: {pcs: WHIR, field: any, arch: any, requires: "k-aligned guest-program pointers (XMSS violates: stride-5/copy_5 families)"}
    soundness_cost: "none beyond standard logup terms"
    composable_with: [p15]
    status: closed
    closed_reason: "rung-1 census: only the aligned variant passes arithmetic and the XMSS program structurally misaligns; migration collides with the 283k-cell memory headroom cliff. Best case -1.9% at high design risk."
    reopens_on: "guest-program alignment migration done separately AND memory used re-measured < 4.0M cells"
    latent_parts:
      - "one-eval-claim fold for aligned blocks (no next^j machinery needed)"
      - "two-tier domainsep bus soundness argument"
    iter_added: 1

  - id: p23
    name: sumfold-zerocheck-instance-folding
    category: sumcheck
    source: "NeutronNova (Kothapalli-Setty 2024/1606) §1, Eq.(3)"
    mechanism: >
      Fold n zero-check instances via interleaving polynomial f(b,x) (f(i,.) = w_i) +
      eq(b,B) weighting + ONE sumcheck round over b; folded witness w = w1 + beta*w2.
      Prover cost = commit + field ops of a single sumcheck round; log n rounds for n instances.
    cost_model: "O(n) prover, O(log n) communication per fold; requires LINEARLY HOMOMORPHIC commitments to fold instances"
    assumptions: {pcs: "linearly homomorphic (NOT hash-based WHIR)", field: any, arch: any}
    soundness_cost: "standard sumcheck terms"
    composable_with: [p15]
    status: closed
    closed_reason: "leanVM's WHIR commitment is hash-based (not additively homomorphic) — instance-level folding cannot transplant; in-protocol CLAIM folding is already done by the back-loaded batched AIR sumcheck"
    reopens_on: "a homomorphic-commitment sub-protocol appears in the stack"
    latent_parts:
      - "interleave-f(b,x)+eq(b,B) single-round reduction is a clean alternative to alpha-RLC batching for SAME-shape claims"
    iter_added: 2

  - id: p24
    name: ccs-superspartan-free-additions
    category: other
    source: "Setty-Thaler-Wahby 2023/552 (CCS) §1.1"
    mechanism: >
      CCS framing: AIR = matrix-vector products + Hadamards + summation; SuperSpartan proves
      CCS with prover crypto costs independent of constraint degree and 'free' addition gates
      for uniform instances. leanVM IS this family (SuperSpartan+WHIR per program.md).
    cost_model: "reference cost frame: field work scales with degree, commitments only with witness"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p12, p14]
    status: used
    iter_added: 2

  - id: p25
    name: basefold-style-fri-sumcheck-interleave
    category: pcs
    source: "Zeilberger-Chen-Fisch 2023/1705 (BaseFold) abstract/§1"
    mechanism: >
      Multilinear PCS = FRI-style folding interleaved round-by-round with the classical
      sumcheck; foldable-code generalization. WHIR descends from this line (constrained RS
      codes unify the two). Explains why leanVM's WHIR open IS a product sumcheck.
    cost_model: "O(n log n) prover; the open = 1 eq-weighted product sumcheck + Merkle openings"
    assumptions: {pcs: WHIR/FRI-family, field: "FFT-friendly or foldable code", arch: any}
    soundness_cost: "per WHIR paper"
    composable_with: [p17, p10]
    status: used
    iter_added: 2

  - id: p26
    name: stir-rate-shifting-fewer-queries
    category: pcs
    source: "Arnon-Chiesa-Fenzi-Yogev 2024/390 (STIR) abstract"
    mechanism: >
      Recursively IMPROVE the rate of the tested RS code between rounds => query complexity
      O(log d + lambda loglog d) vs FRI's O(lambda log d); 1.25-2.46x argument-size reduction.
      WHIR already incorporates the lesson (leanVM's RS_DOMAIN_INITIAL_REDUCTION_FACTOR=5).
    cost_model: "proof-size lever, mild prover cost; ALL relevant params PROTECTED in leanVM"
    assumptions: {pcs: RS-IOPP, field: FFT-friendly, arch: any}
    soundness_cost: "Johnson-bound analysis per paper"
    composable_with: []
    status: closed
    closed_reason: "hard constraint 6: WHIR_*/RS_DOMAIN_* constants protected"
    reopens_on: "constraint lifted"
    iter_added: 2

  - id: p27
    name: deepfold-list-decoding-batch-eval
    category: pcs
    source: "Guo-Liu-Huang-Qu-Tao-Zhang (DeepFold, USENIX'25) abstract"
    mechanism: >
      FRI-multilinear PCS at the LIST-DECODING radius (fewer query repetitions, 3x smaller
      proofs than BaseFold) + a batch evaluation scheme handling polynomials whose size is
      NOT a power of two.
    cost_model: >
      Non-power-of-2 batch eval is the interesting latent: leanVM pads 60.2M cells to 2^26
      (10% waste). Swapping/augmenting the PCS = protected territory + recursion rewrite.
    assumptions: {pcs: "FRI-family replacement", field: FFT-friendly, arch: any}
    soundness_cost: "list-decoding-radius assumptions (STRONGER than leanVM's proven Johnson regime)"
    composable_with: []
    status: closed
    closed_reason: "constraint 6 (protected PCS) + relies on list-decoding conjectures vs the experiment's proven 124-bit Johnson regime"
    reopens_on: "constraints lifted AND security regime re-approved"
    latent_parts:
      - "non-power-of-2 batch-eval idea: the 10% padding waste is real but unreachable here"
    iter_added: 2

  - id: p28
    name: spartan-spark-sparse-commit
    category: pcs
    source: "Setty 2019/550 (Spartan) abstract/§1"
    mechanism: >
      SPARK compiler: commit to sparse multilinears via dense commitments to the
      (row, col, val) streams + offline memory checking; time-optimal prover for R1CS.
    cost_model: "reference; leanVM commits dense trace columns directly (no sparse matrices at prove time)"
    assumptions: {pcs: any, field: any, arch: any}
    soundness_cost: none
    composable_with: [p24]
    status: available
    iter_added: 2

  - id: p29
    name: shout-one-hot-addressing
    category: lookup
    source: "Setty-Thaler 2025 (Twist and Shout) abstract"
    mechanism: >
      Memory checking via one-hot address encodings + increments; no grand-product/grand-sum
      arguments; prover commits only to small/sparse one-hot data (cheap under homomorphic or
      small-value-friendly commitments).
    cost_model: ">=2-4x prover savings claimed vs logup-class in Jolt-like settings"
    assumptions: {pcs: "benefits require small-value-aware commitment costs", field: any, arch: any}
    soundness_cost: "per paper"
    composable_with: [p15]
    status: closed
    closed_reason: "pw8 assessment: shout/logup* family measured a native wash for leanVM at this workload (hash-based commitment makes small-value commits NOT proportionally cheaper; bus tuple count unchanged)"
    reopens_on: "commitment scheme with value-dependent cost, or workload where one-hot sparsity >> current bus density"
    iter_added: 2

# Compositions: novel constructs from combining primitives.
# At least one pool entry per iteration must be a composition.

compositions:
  - id: c1
    name: air-efround-pack
    composed_of: [p12, p18, p14]
    novel_claim: >
      Maintaining Gruen's Qbar multilinear quotient table INSIDE a fused fold+eval single
      pass makes the z=0 constraint-eval elimination memory-free (no extra table pass):
      neither paper describes combining the quotient cache with pass fusion.
    iter_added: 1

  - id: c2
    name: whir-lazy-fusion
    composed_of: [p17, p10, p9]
    novel_claim: >
      Chunk-wise lazy weight recomputation fused with the round-0 fold yields a
      transcript-identical WHIR opener that never materializes the combined weight AND
      keeps the folded polynomial in delayed-EF base slices — the BDT slice trick applied
      to a statement-superposition weight, not a committed polynomial.
    iter_added: 1

  - id: c3
    name: gkr-bottom-fusion
    composed_of: [p16, p10, p15]
    novel_claim: >
      The 4-ary fraction-combine custom gate with delayed-EF base-field numerators fuses
      the two dominant LogUp-GKR layers into one wide sumcheck — 1284 only considers
      pairwise gates; BDT never applies slices to fraction ladders.
    iter_added: 1

  - id: c4
    name: poseidon-gkr-virtualization
    composed_of: [p1, p4, p6, p8]
    novel_claim: >
      Data-parallel power-circuit GKR over the Poseidon permutation replacing committed
      checkpoint columns, bus claims attested by GKR input/output layer evals.
    status: closed
    closed_reason: "see p3.closed_reason — recursion ceiling (3%) is structurally violated by ladder transcript; eval FLOPs do not improve (EF-creep identical)"
    iter_added: 1

# Pricing rules — apply to every composition before pool admission.

pricing_rules:
  conversion_factors:
    air_sumcheck: 1.0        # compute-bound (sample: 20% busy in poseidon eval, IPC ~3.4)
    whir_gkr: 0.5            # combine_statement+product region partially memory-bound (2.7GB traffic / 275ms)
  arch_facts:
    ef_blend_vs_base: 3.7    # measured EFPacking blended unit cost vs BasePacked in poseidon AIR eval (MDS mul_kb dominated)
    ef_mul_kb: "EF x F-const = 5 base muls"
    ef_rounds_share: 0.78    # EF rounds share of poseidon AIR eval (rounds 1+ vs round 0)
  boundaries:               # measured iter-1, 1550-sig XMSS, log_inv_rate=1
    stacked_cells: 60194816  # = 2^25 * 1.79; headroom to 2^27 boundary = 74M cells
    nu: 26
    nu_boundary: 33554432    # cells <= 2^25 -> nu=25 (needs -26.7M cells); merkle 606ms + FFT 75ms would ~halve
    logup_data: 19660800     # = 2^24 * 1.17; gkr_n_vars ~ 25
    recursion_bytecode: "209762 instrs, padded 2^18, +52k headroom before 2^19"
    poseidon_table_cells: 28835840  # 110 cols x 2^18 rows = 48% of all stacked cells
    merkle_ms_per_chunk: 37  # -1 sponge chunk/leaf per -4.2M cells
    span_ms: {commit: 726, air_sumcheck: 569, whir_open: 510, logup_gkr: 210, witness: 118, total: 2150}  # iter-2b post-keep @ c8ea299c; logup = leaf ~40 + gkr 170
    mul_floor_law: "M4: memory passes ~free (1.34GB read ~13ms); price mechanisms in packed-mul count, not GB"
  gate:
    keep_threshold_pct: -1.0
    proof_size_penalty: "3x size-increase-%; +20% hard ceiling"
    recursion_ceiling_pct: 3.0
    transcript_rule: "deltas multiply per WHIR instance in bundle; GKR round = 2 EF (rust bare) / 4 EF (mirrors full)"
