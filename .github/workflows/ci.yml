name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-plonky3-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - name: Clone Plonky3
        run: git clone --depth 1 https://github.com/Plonky3/Plonky3.git plonky3

      - name: Build correctness checker
        run: cargo build --profile bench
        working-directory: harness/plonky3/correctness

  build-leanmultisig-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - name: Clone leanMultisig
        run: git clone --depth 1 https://github.com/maceip/leanMultisig.git leanMultisig

      - name: Check bench crate compiles
        run: cargo check --release
        working-directory: harness/leanmultisig/bench
